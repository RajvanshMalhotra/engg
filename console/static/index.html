<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operator · Kestrel Labs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
  /* THESIS: an audit console that feels like a finished financial product — ink frame, ledger-paper workspace,
     one green that means "verified", amber that only ever means "a human is needed", and a verdict stamp. */
  :root {
    --ground: #F3F5F1;      /* ledger paper */
    --sheet: #FFFFFF;
    --sheet-2: #F8FAF7;
    --rule: #DCE4DC;
    --rule-2: #C9D5CB;
    --ink: #121B24;         /* app frame + text */
    --ink-2: #33404C;
    --pencil: #5C6874;
    --brand: #155E3B;       /* ledger green: primary action + verified */
    --brand-2: #0F4A2E;
    --brand-wash: #E3F1E8;
    --amber: #8A4F00;
    --amber-fill: #F2A93B;
    --amber-wash: #FFF4E0;
    --bad: #A8231B;
    --bad-wash: #FBEAE8;
    --focus: #2457C5;
    --blue-wash: #E7EEFB;
    --serif: "Source Serif 4", Georgia, serif;
    --sans: "Public Sans", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --shadow-1: 0 1px 2px rgba(18, 27, 36, 0.06), 0 1px 1px rgba(18, 27, 36, 0.04);
    --shadow-2: 0 6px 20px -6px rgba(18, 27, 36, 0.18), 0 2px 6px -2px rgba(18, 27, 36, 0.08);
    --ease: cubic-bezier(.16, 1, .3, 1);
  }
  * { box-sizing: border-box; }
  html { font-size: 16px; -webkit-font-smoothing: antialiased; }
  body { margin: 0; background: var(--ground); color: var(--ink); font: 400 0.9375rem/1.55 var(--sans);
         font-variant-numeric: tabular-nums; }
  ::selection { background: #CFE6D7; color: var(--ink); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #C3CEC5; border-radius: 10px; border: 2px solid var(--ground); }
  ::-webkit-scrollbar-track { background: transparent; }
  a { color: inherit; text-underline-offset: 3px; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
  button { font: inherit; cursor: pointer; }
  .ic { width: 1em; height: 1em; flex: none; vertical-align: -0.14em; stroke: currentColor; fill: none; stroke-width: 2;
        stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- app frame */
  .bar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 1.25rem; height: 3.5rem;
         padding: 0 2rem; background: var(--ink); color: #E9EEF2; }
  .brand { display: flex; align-items: center; gap: 0.6rem; text-decoration: none; font-weight: 700; font-size: 1.125rem;
           letter-spacing: -0.01em; color: #fff; }
  .mark { width: 1.75rem; height: 1.75rem; border-radius: 6px; background: var(--brand); display: grid; place-items: center; }
  .mark .ic { width: 1.05rem; height: 1.05rem; stroke: #fff; stroke-width: 2.4; }
  .env { display: inline-flex; align-items: center; gap: 0.45rem; padding: 0.2rem 0.65rem; border-radius: 999px;
         background: rgba(255,255,255,0.08); color: #C3CDD6; font-size: 0.8125rem; }
  .env .dot { width: 0.45rem; height: 0.45rem; border-radius: 50%; background: #5BC08A; }
  .bar nav { margin-left: auto; display: flex; gap: 0.25rem; }
  .bar nav a { color: #C3CDD6; text-decoration: none; font-weight: 600; font-size: 0.8125rem; padding: 0.4rem 0.75rem; border-radius: 6px; }
  .bar nav a:hover { color: #fff; background: rgba(255,255,255,0.08); }
  main { padding: 2rem 2rem 5rem; max-width: 1480px; margin: 0 auto; }

  /* ---------- shared */
  .panel { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; box-shadow: var(--shadow-1); }
  .h2 { font: 600 1.125rem/1.3 var(--sans); margin: 0 0 0.9rem; letter-spacing: -0.01em; }
  .quiet { color: var(--pencil); margin: 0; }
  .pill { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.15rem 0.6rem 0.15rem 0.45rem; border-radius: 999px;
          font-size: 0.8125rem; font-weight: 600; white-space: nowrap; }
  .pill .ic { width: 0.95em; height: 0.95em; }
  .s-verified, .s-justified_stop { background: var(--brand-wash); color: var(--brand); }
  .s-running, .s-starting { background: var(--blue-wash); color: var(--focus); }
  .s-not_verified, .s-error, .s-budget_exhausted, .s-interrupted { background: var(--bad-wash); color: var(--bad); }
  .s-waiting { background: var(--amber-wash); color: var(--amber); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; border-radius: 8px; border: 1px solid transparent;
         padding: 0.65rem 1.15rem; font-weight: 600; transition: background 160ms var(--ease), box-shadow 160ms var(--ease), transform 160ms var(--ease); }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--brand); color: #fff; box-shadow: 0 1px 0 rgba(255,255,255,0.15) inset, var(--shadow-1); }
  .btn-primary:hover { background: var(--brand-2); }
  .btn-primary[disabled] { opacity: 0.6; cursor: progress; }
  .btn-ghost { background: var(--sheet); color: var(--bad); border-color: #E5B9B5; }
  .btn-ghost:hover { background: var(--bad-wash); }

  /* ---------- home */
  .home { display: grid; grid-template-columns: minmax(340px, 460px) 1fr; gap: 2rem; align-items: start; }
  .compose { padding: 1.5rem; position: sticky; top: 5.5rem; }
  .compose h1 { font: 600 1.5rem/1.25 var(--sans); letter-spacing: -0.02em; margin: 0 0 0.35rem; }
  .compose .sub { color: var(--pencil); margin: 0 0 1.25rem; }
  .compose textarea { width: 100%; min-height: 7.5rem; padding: 0.85rem 1rem; border: 1px solid var(--rule-2); border-radius: 8px;
                      font: 400 1.125rem/1.45 var(--serif); color: var(--ink); resize: vertical; background: var(--sheet-2);
                      transition: border-color 160ms var(--ease), box-shadow 160ms var(--ease); }
  .compose textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(21, 94, 59, 0.15); background: #fff; }
  .compose textarea::placeholder { color: #8A949D; }
  .suggest { margin: 0.9rem 0 1.4rem; }
  .suggest p { margin: 0 0 0.45rem; font-size: 0.8125rem; color: var(--pencil); font-weight: 600; }
  .suggest ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.3rem; }
  .suggest button { width: 100%; text-align: left; display: flex; gap: 0.55rem; align-items: baseline; border: 0; background: none;
                    padding: 0.35rem 0.5rem; border-radius: 6px; color: var(--ink-2); font-size: 0.9375rem; }
  .suggest button:hover { background: var(--brand-wash); color: var(--brand-2); }
  .suggest button .ic { color: var(--brand); position: relative; top: 0.12em; }
  .group { border-top: 1px solid var(--rule); padding: 1rem 0 0.25rem; margin: 0; border-left: 0; border-right: 0; border-bottom: 0; }
  .group legend { font-weight: 600; font-size: 0.9375rem; padding: 0 0.4rem 0 0; }
  .toggle { display: grid; grid-template-columns: 2.25rem 1fr; gap: 0.75rem; align-items: center; padding: 0.4rem 0; cursor: pointer; }
  .toggle input { appearance: none; width: 2.25rem; height: 1.3rem; border-radius: 999px; background: #CBD5CD; position: relative;
                  cursor: pointer; transition: background 160ms var(--ease); margin: 0; }
  .toggle input::after { content: ""; position: absolute; top: 0.15rem; left: 0.15rem; width: 1rem; height: 1rem; border-radius: 50%;
                         background: #fff; box-shadow: var(--shadow-1); transition: transform 200ms var(--ease); }
  .toggle input:checked { background: var(--brand); }
  .toggle input:checked::after { transform: translateX(0.95rem); }
  .toggle span small { display: block; color: var(--pencil); font-size: 0.8125rem; }
  .go-row { display: flex; align-items: center; gap: 1rem; margin-top: 1.25rem; }
  .formerr { color: var(--bad); font-size: 0.8125rem; }

  .home > *, .cols > * { min-width: 0; }
  #list { overflow-x: auto; }
  .runs-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin: 0.25rem 0 0.9rem; }
  .runs-head h2 { font: 600 1.5rem/1.25 var(--sans); letter-spacing: -0.02em; margin: 0; }
  .tally { color: var(--pencil); font-size: 0.9375rem; }
  .tally b { color: var(--ink); font-weight: 600; }
  .ledger { width: 100%; border-collapse: separate; border-spacing: 0; }
  .ledger th { text-align: left; font-weight: 600; font-size: 0.8125rem; color: var(--pencil); padding: 0.7rem 1rem;
               border-bottom: 1px solid var(--rule); background: var(--sheet-2); }
  .ledger th:first-child { border-top-left-radius: 10px; } .ledger th:last-child { border-top-right-radius: 10px; }
  .ledger td { padding: 0.85rem 1rem; border-bottom: 1px solid var(--rule); vertical-align: middle; }
  .ledger tr:last-child td { border-bottom: 0; }
  .ledger tr.link { cursor: pointer; transition: background 120ms var(--ease); }
  .ledger tr.link:hover td { background: #F7FAF7; }
  .ledger td.req { font-family: var(--serif); font-size: 1.125rem; color: var(--ink); max-width: 36rem; }
  .ledger td.when { color: var(--pencil); white-space: nowrap; font-size: 0.8125rem; }
  .num { text-align: right; white-space: nowrap; }
  .empty { color: var(--pencil); padding: 2rem 1rem; text-align: center; }

  /* ---------- run header */
  .crumbs { display: flex; align-items: center; gap: 0.4rem; color: var(--pencil); font-size: 0.8125rem; margin-bottom: 0.9rem; }
  .crumbs a { text-decoration: none; font-weight: 600; } .crumbs a:hover { color: var(--ink); }
  .memo { display: grid; grid-template-columns: 1fr auto; gap: 2rem; align-items: start; margin-bottom: 1.5rem; }
  .ask { font: 500 clamp(1.9rem, 2.8vw, 2.6rem)/1.15 var(--serif); margin: 0; max-width: 32ch; letter-spacing: -0.015em; text-wrap: balance; }
  .goal { margin: 0.75rem 0 0; max-width: 72ch; color: var(--ink-2); font-size: 1.125rem; }
  .facts { display: flex; flex-wrap: wrap; gap: 0.5rem 1.5rem; margin: 1rem 0 0; color: var(--pencil); font-size: 0.9375rem; }
  .facts span { display: inline-flex; align-items: center; gap: 0.4rem; }
  .facts b { color: var(--ink); font-weight: 600; }
  .now { display: flex; align-items: center; gap: 0.65rem; margin: 1rem 0 0; padding: 0.6rem 0.9rem; max-width: 72ch;
         background: var(--blue-wash); border-radius: 8px; color: #1C3E86; font-family: var(--serif); font-style: italic; }
  .pulse { width: 0.55rem; height: 0.55rem; border-radius: 50%; background: var(--focus); flex: none; box-shadow: 0 0 0 0 rgba(36, 87, 197, 0.45);
           animation: pulse 1.6s var(--ease) infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(36, 87, 197, 0.45); } 70% { box-shadow: 0 0 0 9px rgba(36, 87, 197, 0); } 100% { box-shadow: 0 0 0 0 rgba(36, 87, 197, 0); } }

  .stamp { position: relative; font: 800 1.5rem/1 var(--sans); letter-spacing: 0.04em; text-transform: none; padding: 0.7rem 1.2rem;
           border: 3px solid currentColor; border-radius: 8px; transform: rotate(-5deg); white-space: nowrap; margin-top: 0.4rem;
           background: rgba(255,255,255,0.4); }
  .stamp::after { content: ""; position: absolute; inset: 4px; border: 1px solid currentColor; border-radius: 4px; opacity: 0.55; }
  .stamp.ok { color: var(--brand); } .stamp.bad { color: var(--bad); }
  .stamp.live { color: var(--focus); border-style: dashed; transform: none; font-size: 1.125rem; }
  .stamp.live::after { display: none; }
  .stamp.land { animation: land 560ms var(--ease) both; }
  @keyframes land { 0% { transform: rotate(-5deg) scale(2.2); opacity: 0; filter: blur(6px); }
                    60% { opacity: 1; filter: blur(0); } 100% { transform: rotate(-5deg) scale(1); } }

  /* the one region-owning moment: a human is needed */
  .await { display: grid; grid-template-columns: auto 1fr auto; gap: 1.25rem 1.5rem; align-items: start; margin: 0 0 1.75rem;
           padding: 1.25rem 1.5rem; border-radius: 12px; background: var(--amber-wash); border: 1px solid #F1D29A;
           box-shadow: var(--shadow-2); animation: arrive 420ms var(--ease) both; }
  @keyframes arrive { from { transform: translateY(-10px); opacity: 0; } to { transform: none; opacity: 1; } }
  .await .badge { width: 2.75rem; height: 2.75rem; border-radius: 10px; background: var(--amber-fill); display: grid; place-items: center; color: #3D2300; }
  .await .badge .ic { width: 1.4rem; height: 1.4rem; }
  .await h3 { margin: 0; font: 700 1.5rem/1.25 var(--sans); color: #3D2300; letter-spacing: -0.01em; }
  .await p { margin: 0.2rem 0 0.8rem; color: #6B3E00; }
  .await dl { display: grid; grid-template-columns: repeat(auto-fill, minmax(10rem, 1fr)); gap: 0.6rem 1.5rem; margin: 0; }
  .await dt { font-size: 0.8125rem; color: #8A5A13; }
  .await dd { margin: 0; font-weight: 600; color: #2B1A00; overflow-wrap: anywhere; }
  .await dd.big { font-size: 1.5rem; }
  .await .act { display: grid; gap: 0.55rem; min-width: 14rem; }
  .await input { width: 100%; padding: 0.55rem 0.7rem; border: 1px solid #E7C27F; border-radius: 8px; font: inherit; background: #fff; }
  .await .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 0.55rem; }

  .tabs { display: inline-flex; gap: 0.25rem; padding: 0.25rem; background: #E7ECE6; border-radius: 10px; margin: 0 0 1.75rem; }
  .tabs a { display: inline-flex; align-items: center; gap: 0.45rem; padding: 0.45rem 1rem; text-decoration: none; color: var(--pencil);
            font-weight: 600; border-radius: 8px; font-size: 0.9375rem; }
  .tabs a[aria-current="page"] { background: var(--sheet); color: var(--ink); box-shadow: var(--shadow-1); }

  /* ---------- quick view */
  .cols { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(330px, 1fr); gap: 1.5rem; align-items: start; }
  .card { padding: 1.35rem 1.5rem; }
  .col > * + * { margin-top: 1.5rem; }
  .track { list-style: none; margin: 0; padding: 0; }
  .track li { position: relative; padding: 0 0 1.2rem 2.4rem; }
  .track li::before { content: ""; position: absolute; left: 0.75rem; top: 1.75rem; bottom: 0.15rem; width: 2px; background: var(--rule); border-radius: 2px; }
  .track li.t-done::before { background: #A9CDB6; }
  .track li:last-child { padding-bottom: 0; } .track li:last-child::before { display: none; }
  .node { position: absolute; left: 0; top: 0.05rem; width: 1.6rem; height: 1.6rem; border-radius: 50%; display: grid; place-items: center;
          border: 2px solid var(--rule-2); background: var(--sheet); color: var(--pencil); font-size: 0.8125rem; font-weight: 700; }
  .node .ic { width: 0.95rem; height: 0.95rem; stroke-width: 2.6; }
  .t-done .node { background: var(--brand); border-color: var(--brand); color: #fff; }
  .t-in_progress .node { border-color: var(--focus); color: var(--focus); }
  .t-blocked .node { background: var(--bad); border-color: var(--bad); color: #fff; }
  .t-skipped .node { border-style: dashed; }
  .goal-line { font-weight: 600; color: var(--ink); }
  .t-skipped .goal-line, .t-pending .goal-line { color: var(--pencil); font-weight: 500; }
  .tag { display: inline-block; margin-left: 0.5rem; font-size: 0.8125rem; font-weight: 600; padding: 0.05rem 0.45rem; border-radius: 4px;
         background: #EEF1EE; color: var(--pencil); vertical-align: 0.1em; }
  .t-in_progress .tag { background: var(--blue-wash); color: var(--focus); }
  .t-blocked .tag { background: var(--bad-wash); color: var(--bad); }
  .why { margin-top: 0.2rem; color: var(--ink-2); font-size: 0.9375rem; display: -webkit-box; -webkit-line-clamp: 2;
         -webkit-box-orient: vertical; overflow: hidden; }

  .checks { list-style: none; margin: 0; padding: 0; }
  .checks li + li { border-top: 1px solid var(--rule); }
  .checks summary, .checks .row { list-style: none; display: grid; grid-template-columns: 1.6rem 1fr; gap: 0.6rem;
         padding: 0.7rem 0; align-items: start; }
  .checks summary { cursor: pointer; }
  .checks summary::-webkit-details-marker { display: none; }
  .cmark { width: 1.45rem; height: 1.45rem; border-radius: 50%; display: grid; place-items: center; margin-top: 0.05rem; }
  .cmark .ic { width: 0.85rem; height: 0.85rem; stroke-width: 3; }
  .c-met .cmark { background: var(--brand-wash); color: var(--brand); }
  .c-unmet .cmark { background: var(--bad-wash); color: var(--bad); }
  .c-pending .cmark { border: 2px dashed var(--rule-2); }
  .checks .ev { margin: -0.2rem 0 0.8rem 2.2rem; font-size: 0.8125rem; color: var(--ink-2); padding: 0.6rem 0.75rem; background: var(--sheet-2);
                border-radius: 6px; }

  .human { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.5rem; }
  .human li { display: grid; grid-template-columns: 1.6rem 1fr; gap: 0.6rem; padding: 0.65rem 0.8rem; background: var(--amber-wash); border-radius: 8px; }
  .human li.declined { background: var(--bad-wash); }
  .human .hic { color: var(--amber); padding-top: 0.15rem; } .human li.declined .hic { color: var(--bad); }
  .human b { display: block; color: #4A2C00; font-weight: 600; } .human li.declined b { color: var(--bad); }
  .human span { font-size: 0.8125rem; color: var(--ink-2); overflow-wrap: anywhere; }

  .shots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; }
  .shots a { display: block; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; text-decoration: none; background: var(--sheet);
             transition: box-shadow 160ms var(--ease), transform 160ms var(--ease); }
  .shots a:hover { box-shadow: var(--shadow-2); transform: translateY(-1px); }
  .shots img { width: 100%; display: block; aspect-ratio: 4 / 3; object-fit: cover; object-position: top; border-bottom: 1px solid var(--rule); }
  .shots span { display: block; font-size: 0.8125rem; color: var(--ink-2); padding: 0.35rem 0.55rem; font-weight: 500; }
  .summary { white-space: pre-wrap; font-size: 0.9375rem; color: var(--ink-2); }
  details.more { margin-top: 1.1rem; }
  details.more > summary { cursor: pointer; font-weight: 600; color: var(--ink-2); display: inline-flex; align-items: center; gap: 0.4rem; }
  details.more > summary::-webkit-details-marker { display: none; }
  details.more > summary .ic { transition: transform 200ms var(--ease); color: var(--pencil); }
  details.more[open] > summary .ic { transform: rotate(90deg); }
  details.more[open] > summary { margin-bottom: 0.8rem; }
  pre.report { white-space: pre-wrap; font: 400 0.8125rem/1.5 var(--mono); max-height: 28rem; overflow: auto; margin: 0;
               background: var(--sheet-2); border: 1px solid var(--rule); border-radius: 8px; padding: 0.75rem 0.9rem; }

  .steps { list-style: none; margin: 0; padding: 0; }
  .steps li { display: grid; grid-template-columns: 2rem 1fr; gap: 0.6rem; padding: 0.5rem 0; border-top: 1px solid var(--rule); }
  .steps .n { color: var(--pencil); text-align: right; font-weight: 600; font-size: 0.8125rem; }
  .steps .thought { font-family: var(--serif); font-style: italic; color: var(--ink-2); }
  .steps .tool { font-weight: 600; }
  .steps .args { color: var(--pencil); font: 400 0.8125rem/1.45 var(--mono); overflow-wrap: anywhere; }
  .steps .res { font-size: 0.8125rem; overflow-wrap: anywhere; color: var(--ink-2); }
  .steps li.fail .tool, .steps li.fail .res { color: var(--bad); }
  .steps li.ctl .tool, .steps li.ctl .res { font-weight: 400; color: var(--pencil); }
  .steps li.ctl .args { display: none; }
  .steps li.policy .tool { color: var(--amber); }
  .smark { display: inline-flex; width: 1.1rem; vertical-align: -0.12em; }
  .ok > div > .smark, .call:not(.fail) .smark { color: var(--brand); } .fail .smark { color: var(--bad); }

  /* ---------- deep dive */
  .deep { max-width: 1180px; }
  .jump { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1.75rem; }
  .jump button { border: 1px solid var(--rule); background: var(--sheet); border-radius: 999px; padding: 0.3rem 0.9rem; font-size: 0.8125rem;
                 color: var(--ink-2); font-weight: 600; }
  .jump button:hover { border-color: var(--rule-2); background: var(--sheet-2); }
  .deep > section { margin-bottom: 2.75rem; scroll-margin-top: 5rem; }
  .deep h2 { font: 600 1.5rem/1.25 var(--sans); margin: 0 0 1rem; letter-spacing: -0.01em; }
  .kv { display: grid; grid-template-columns: 12rem 1fr; gap: 0.6rem 1.5rem; margin: 0; padding: 1.25rem 1.5rem; }
  .kv dt { color: var(--pencil); font-size: 0.8125rem; padding-top: 0.1rem; }
  .kv dd { margin: 0; color: var(--ink); }
  .kv ul { margin: 0; padding-left: 1.1rem; } .kv li { margin-bottom: 0.3rem; }
  .turn { margin-bottom: 0.85rem; scroll-margin-top: 5rem; overflow: hidden; }
  .turn.flash { outline: 2px solid var(--focus); }
  .turn > header { display: flex; justify-content: space-between; gap: 1rem; padding: 0.6rem 1.1rem; border-bottom: 1px solid var(--rule);
                   font-size: 0.8125rem; color: var(--pencil); background: var(--sheet-2); }
  .turn > header b { color: var(--ink); font-size: 0.9375rem; }
  .turn .body { padding: 0.9rem 1.1rem; display: grid; gap: 0.7rem; }
  .turn .thought { font-family: var(--serif); font-style: italic; color: var(--ink-2); margin: 0; font-size: 1.125rem; }
  .call { border-top: 1px dashed var(--rule); padding-top: 0.65rem; }
  .call:first-of-type { border-top: 0; padding-top: 0; }
  .call .head { display: flex; gap: 0.5rem; align-items: baseline; flex-wrap: wrap; }
  .call .name { font-weight: 600; }
  .call.fail .name, .call.fail .sum { color: var(--bad); }
  .call .sum, .sum { font-size: 0.8125rem; color: var(--ink-2); }
  .args-inline { display: block; margin-top: 0.25rem; font: 400 0.8125rem/1.45 var(--mono); color: var(--pencil); overflow-wrap: anywhere; }
  .call pre, .deep pre { margin: 0.4rem 0 0; padding: 0.6rem 0.75rem; background: var(--sheet-2); border: 1px solid var(--rule); border-radius: 6px;
                         white-space: pre-wrap; overflow-wrap: anywhere; font: 400 0.8125rem/1.5 var(--mono); max-height: 22rem; overflow: auto; }
  .flag { font-size: 0.8125rem; padding: 0.45rem 0.7rem; border-radius: 6px; background: var(--amber-wash); color: #6B3E00; }
  .flag.bad { background: var(--bad-wash); color: var(--bad); }
  .flag.ok { background: var(--brand-wash); color: var(--brand); }
  details.inline > summary { cursor: pointer; font-size: 0.8125rem; color: var(--pencil); font-weight: 500; }
  .crit-table { width: 100%; border-collapse: collapse; }
  .crit-table td, .crit-table th { text-align: left; vertical-align: top; padding: 0.7rem 1rem; border-bottom: 1px solid var(--rule); font-size: 0.9375rem; }
  .crit-table tr:last-child td { border-bottom: 0; }
  .crit-table th { font-size: 0.8125rem; color: var(--pencil); font-weight: 600; background: var(--sheet-2); }
  .crit-table td.m { width: 2.5rem; }
  .attempt { margin: 1.25rem 0 0.6rem; font: 600 1.125rem/1.3 var(--sans); }
  .lessons { margin: 0; padding-left: 1.1rem; } .lessons li { margin-bottom: 0.45rem; }

  @media (max-width: 1060px) { .cols, .home { grid-template-columns: 1fr; } .compose { position: static; }
    .memo { grid-template-columns: 1fr; } .await { grid-template-columns: 1fr; } .shots { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 640px) { main { padding: 1.25rem 1rem 4rem; } .bar { padding: 0 1rem; } .env { display: none; }
    .kv { grid-template-columns: 1fr; } .ledger td.when, .ledger th.when { display: none; } }
  @media (prefers-reduced-motion: reduce) { .stamp.land, .await, .pulse { animation: none; } * { transition: none !important; } }
</style>
</head>
<body>
<!--
THESIS: an audit console that reads like a finished financial product; refuses the generic SaaS card grid.
OWN-WORLD: ledger-paper workspace under an ink app bar; one ledger green for action + verified; amber only for "a human is
needed"; red only for failure; Source Serif 4 for the human's request and the agent's thoughts, Public Sans for the UI;
authored stroke icons; the verdict as an ink stamp.
STORY: see what was asked, what "done" means, watch it work, step in when policy asks, trust the stamp because the checks show why.
FIRST VIEWPORT: request as a serif memo with the stamp at right; amber approval band takes the full width when a human is needed;
progress track left, checks right.
FORM: refinement of the incumbent ledger world at premium fidelity (no concept roll: identity preserved by request).
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
-->
<header class="bar">
  <a class="brand" href="#/"><span class="mark"><svg class="ic" viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7"/></svg></span>Operator</a>
  <span class="env"><span class="dot"></span>Kestrel Labs · accounts payable · sandbox</span>
  <nav><a href="#/">Runs</a></nav>
</header>
<main id="app" aria-live="polite"></main>

<script>
const $app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const STATUS = {verified: "Verified", justified_stop: "Stopped correctly", not_verified: "Not verified",
                budget_exhausted: "Out of budget", error: "Run error", running: "Working", starting: "Starting",
                interrupted: "Interrupted", waiting: "Waiting for you"};
const money = n => "$" + Number(n || 0).toFixed(3);
const CONTROL = new Set(["note", "update_plan", "read_page"]);
// Evidence file names → what happened, in the reader's words.
const SHOT = [[/erp-login/, "Signed in to the ERP"], [/bills-new/, "Bill saved"], [/schedule-payment/, "Payment scheduled"],
              [/mail-send/, "Email sent"], [/vendors-new/, "Vendor created"], [/bank/, "Bank details change"], [/^look/, "Vision check"]];
const shotName = f => (SHOT.find(([re]) => re.test(f.replace(/^\d+-/, ""))) || [0, f.replace(".png", "")])[1];
let timer = null, lastRender = "", stampShown = false;

// One authored stroke icon set (24px grid, 2px stroke).
const ICONS = {
  check: '<path d="M5 12.5l4.2 4.2L19 7"/>',
  x: '<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
  clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  steps: '<path d="M4 7h10M4 12h16M4 17h7"/>',
  coin: '<ellipse cx="12" cy="7" rx="7" ry="3"/><path d="M5 7v5c0 1.7 3.1 3 7 3s7-1.3 7-3V7M5 12v5c0 1.7 3.1 3 7 3s7-1.3 7-3v-5"/>',
  hand: '<path d="M8 13V6.5a1.5 1.5 0 013 0V12M11 11V5a1.5 1.5 0 013 0v6M14 11V6.5a1.5 1.5 0 013 0V14c0 3.6-2.4 6.5-6 6.5-2.6 0-4.3-1.3-5.5-3.3L4 14.2a1.5 1.5 0 012.6-1.5L8 15"/>',
  shield: '<path d="M12 3.5l7 2.5v5.5c0 4.4-3 7.9-7 9-4-1.1-7-4.6-7-9V6l7-2.5z"/><path d="M9 12l2 2 4-4"/>',
  block: '<circle cx="12" cy="12" r="8.5"/><path d="M6 6l12 12"/>',
  question: '<circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.5a2.5 2.5 0 014.8.9c0 1.7-2.4 2.2-2.4 3.6M12 17h.01"/>',
  arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
  chevron: '<path d="M9 6l6 6-6 6"/>',
  play: '<path d="M8 5.5v13l10-6.5-10-6.5z"/>',
  spark: '<path d="M12 4v4M12 16v4M4 12h4M16 12h4M6.6 6.6l2.3 2.3M15.1 15.1l2.3 2.3M17.4 6.6l-2.3 2.3M8.9 15.1l-2.3 2.3"/>',
  dot: '<circle cx="12" cy="12" r="3.5"/>',
};
const icon = (n, cls = "ic") => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n] || ""}</svg>`;
const statusPill = s => `<span class="pill s-${esc(s)}">${icon(["verified", "justified_stop"].includes(s) ? "check" : ["running", "starting"].includes(s) ? "dot" : s === "waiting" ? "hand" : "x")}${esc(STATUS[s] || s)}</span>`;

const EXAMPLES = [
  "Process every unprocessed vendor invoice in the AP inbox.",
  "What do we still owe Umbrella Office Furniture, and when is it due?",
  "Email the AP lead a list of all unpaid bills with their amounts and due dates.",
  "Schedule payment for the Globex freight bill that's already in the system.",
  "Reply to Acme's reminder and tell them where their invoice stands.",
  "Update Globex's bank account to 91801009999999, IFSC UTIB0000999.",
  "Which vendor emails this month look suspicious? Flag them to the AP lead."];
const FAULTS = [["flaky_submit", "ERP save fails once", "The first save returns a server error"],
                ["layout_b", "ERP relabels its menus and fields", "Bills become Payables, fields get new names"],
                ["toasts", "Unrelated notifications pop up", "Decoy changes that aren't progress"],
                ["session_expiry", "ERP session expires mid-task", "The operator gets logged out once"]];

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
}
const when = iso => { const d = new Date(iso); return d.toLocaleDateString(undefined, {day: "numeric", month: "short"}) + ", " + d.toLocaleTimeString(undefined, {hour: "2-digit", minute: "2-digit"}); };

/* ---------------- home */
async function home() {
  clearInterval(timer);
  $app.innerHTML = `<div class="home">
    <section class="panel compose" aria-labelledby="new">
      <h1 id="new">Give the operator a task</h1>
      <p class="sub">Write it the way you'd ask a colleague. It reads the company's procedures and works out the rest.</p>
      <form id="f">
        <label class="sr" for="req" style="position:absolute;left:-9999px">Task</label>
        <textarea id="req" required placeholder="Process the latest invoice from Acme."></textarea>
        <div class="suggest"><p>Try one of these</p><ul>${EXAMPLES.map(e => `<li><button type="button" data-ex="${esc(e)}">${icon("arrow")}<span>${esc(e)}</span></button></li>`).join("")}</ul></div>
        <fieldset class="group"><legend>Make the company harder to work with</legend>
          ${FAULTS.map(([k, d, h]) => `<label class="toggle"><input type="checkbox" name="fault" value="${k}"><span>${d}<small>${h}</small></span></label>`).join("")}
        </fieldset>
        <fieldset class="group"><legend>Setup</legend>
          <label class="toggle"><input type="checkbox" id="reset" checked><span>Reset the company first<small>Every run starts from the same data</small></span></label>
          <label class="toggle"><input type="checkbox" id="memory" checked><span>Use lessons from past runs<small>Turn off to run with no memory</small></span></label>
        </fieldset>
        <div class="go-row"><button class="btn btn-primary" id="go">${icon("play")}Start run</button><span class="formerr" id="err" role="alert"></span></div>
      </form>
    </section>
    <section class="runs" aria-labelledby="past">
      <div class="runs-head"><h2 id="past">Runs</h2><span class="tally" id="tally"></span></div>
      <div class="panel" id="list"></div>
    </section>
  </div>`;
  document.querySelectorAll("[data-ex]").forEach(b => b.onclick = () => { const t = document.getElementById("req"); t.value = b.dataset.ex; t.focus(); });
  document.getElementById("f").onsubmit = async ev => {
    ev.preventDefault();
    const go = document.getElementById("go"); go.disabled = true; go.innerHTML = `${icon("dot")}Starting run…`;
    try {
      const {id} = await api("/api/runs", {method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify({
        request: document.getElementById("req").value,
        faults: [...document.querySelectorAll("[name=fault]:checked")].map(c => c.value),
        reset: document.getElementById("reset").checked, memory: document.getElementById("memory").checked})});
      location.hash = "#/run/" + id;
    } catch (e) { document.getElementById("err").textContent = "Couldn't start the run: " + e.message; go.disabled = false; go.innerHTML = `${icon("play")}Start run`; }
  };
  const list = async () => {
    const runs = await api("/api/runs");
    const done = runs.filter(r => !["running", "starting"].includes(r.status));
    const good = done.filter(r => ["verified", "justified_stop"].includes(r.status)).length;
    const live = runs.length - done.length;
    const avg = done.length ? done.reduce((s, r) => s + (r.cost_usd || 0), 0) / done.length : 0;
    document.getElementById("tally").innerHTML = runs.length
      ? `${live ? `<b>${live}</b> working · ` : ""}<b>${good}</b> of ${done.length} verified · ${money(avg)} average cost` : "";
    document.getElementById("list").innerHTML = runs.length ? `<table class="ledger"><thead><tr><th>Request</th><th>Outcome</th>
      <th class="num">Steps</th><th class="num">Cost</th><th class="when">Started</th></tr></thead><tbody>${runs.map(r => `
      <tr class="link" tabindex="0" data-id="${esc(r.id)}"><td class="req">${esc(r.request)}</td>
      <td>${statusPill(r.status)}</td>
      <td class="num">${r.steps ?? "—"}</td><td class="num">${money(r.cost_usd)}</td><td class="when">${esc(when(r.started))}</td></tr>`).join("")}</tbody></table>`
      : `<p class="empty">No runs yet. Give the operator a task on the left.</p>`;
    document.querySelectorAll("tr[data-id]").forEach(tr => { const open = () => location.hash = "#/run/" + tr.dataset.id;
      tr.onclick = open; tr.onkeydown = e => { if (e.key === "Enter") open(); }; });
  };
  await list(); timer = setInterval(list, 4000);
}

/* ---------------- run */
function stepsHtml(events) {
  const rows = []; let verifyGroup = null;
  for (const e of events) {
    if (e.kind === "llm" && e.content) rows.push(`<li><span class="n">${e.step}</span><span class="thought">${esc(e.content)}</span></li>`);
    else if (e.kind === "tool") rows.push(`<li class="${e.ok ? "ok" : "fail"} ${CONTROL.has(e.tool) ? "ctl" : ""}"><span class="n">${e.step}</span><div>
        <span class="smark">${icon(e.ok ? "check" : "x")}</span><span class="tool">${esc(e.tool)}</span> <span class="args">${esc((e.args || "").slice(0, 160))}</span>
        <div class="res">${esc(e.summary || "")}</div></div></li>`);
    else if (e.kind === "policy" && e.effect !== "allow") rows.push(`<li class="policy"><span class="n"></span><div><span class="tool">Policy: ${esc(e.effect.replace("_", " "))}</span>
        <div class="res">${esc(e.reason)} <span class="args">(${esc(e.rule)})</span></div></div></li>`);
    else if (e.kind === "approval") rows.push(`<li class="policy"><span class="n"></span><div><span class="tool">${e.approved ? "Approved" : "Declined"} by ${esc(e.by)}</span>
        <div class="res">${esc(e.request)}${e.note ? " — " + esc(e.note) : ""}</div></div></li>`);
    else if (e.kind === "network_block") rows.push(`<li class="policy"><span class="n"></span><div><span class="tool">Blocked at the network layer</span><div class="res">${esc(e.url)}</div></div></li>`);
    else if (e.kind === "ask_human") rows.push(`<li class="policy"><span class="n"></span><div><span class="tool">Asked the requester</span>
        <div class="res">${esc(e.question)} → <i>${esc(e.reply)}</i></div></div></li>`);
    else if (e.kind === "verify_start") { verifyGroup = []; rows.push("__VERIFY__"); }
    else if (e.kind === "verify_step" && verifyGroup) verifyGroup.push(e);
    else if (e.kind === "verdict") {
      const i = rows.lastIndexOf("__VERIFY__");
      if (i >= 0) rows[i] = `<li><span class="n"></span><div><span class="tool">Independent check</span>
          <details class="res"><summary>${verifyGroup.length} read-only lookups by the verifier</summary>${verifyGroup.map(v => esc(v.tool + " " + (v.summary || ""))).join("<br>")}</details>
          <div class="res"><b>${esc(STATUS[e.overall] || e.overall)}</b>${e.notes ? " — " + esc(e.notes) : ""}</div></div></li>`;
      verifyGroup = null;
    }
    else if (e.kind === "cost_cap" || e.kind === "error") rows.push(`<li class="fail"><span class="n"></span><div class="res">${esc(e.error)}</div></li>`);
  }
  const live = rows.lastIndexOf("__VERIFY__");
  if (live >= 0) rows[live] = `<li><span class="n"></span><div><span class="tool">Independent check in progress…</span>
      <div class="res">${(verifyGroup || []).map(v => esc(v.tool + " " + (v.summary || ""))).join("<br>")}</div></div></li>`;
  return rows.join("") || `<li><span class="n"></span><span class="thought">Reading the request and the relevant company procedures…</span></li>`;
}

const BIG = new Set(["amount_inr", "amount", "bill", "invoice"]);
function approvalHtml(p) {
  const d = p.details || {};
  if (p.kind === "question") return `<section class="await" aria-label="Question from the operator">
      <span class="badge">${icon("question")}</span>
      <div><h3>The operator has a question</h3><p>${esc(p.question)}</p></div>
      <div class="act"><input id="ans-${p.id}" placeholder="Your answer"><button class="btn btn-primary" data-answer="${p.id}">Send answer</button></div></section>`;
  const order = ["amount_inr", "bill", "invoice", "vendor_id", "due_date", "payment_date"];
  const keys = [...order.filter(k => k in d), ...Object.keys(d).filter(k => !order.includes(k) && !["rule", "why"].includes(k))];
  return `<section class="await" aria-label="Approval needed">
    <span class="badge">${icon("hand")}</span>
    <div><h3>${esc(p.approver || "A human")} approval needed</h3><p>${esc(d.why || p.title)} The run is paused until you decide.</p>
      <dl>${keys.map(k => `<div><dt>${esc(k.replace(/_inr$/, " (INR)").replace(/_/g, " ").replace(/^./, c => c.toUpperCase()))}</dt><dd class="${BIG.has(k) ? "big" : ""}">${esc(d[k])}</dd></div>`).join("")}</dl></div>
    <div class="act"><input id="note-${p.id}" placeholder="Note for the operator (optional)">
      <div class="btns"><button class="btn btn-primary" data-decide="${p.id}" data-ok="1">${icon("check")}Approve</button>
      <button class="btn btn-ghost" data-decide="${p.id}" data-ok="0">${icon("x")}Decline</button></div></div></section>`;
}

const ago = (a, b) => { const s = Math.max(0, (new Date(b) - new Date(a)) / 1000); return s < 90 ? `${Math.round(s)} s` : `${Math.round(s / 60)} min`; };
const firstLine = t => String(t || "").split("\n").find(l => l.trim()) || "";

function humanHtml(ev) {
  const items = [];
  for (const e of ev) {
    if (e.kind === "approval") items.push(`<li class="${e.approved ? "" : "declined"}"><span class="hic">${icon(e.approved ? "check" : "x")}</span><div><b>${e.approved ? "Approved" : "Declined"} by ${esc(e.by)}</b>
        <span>${esc(e.request.replace(/\{.*$/, ""))}${e.note && e.note !== "scripted" ? " — " + esc(e.note) : ""}</span></div></li>`);
    else if (e.kind === "ask_human") items.push(`<li><span class="hic">${icon("question")}</span><div><b>Asked: ${esc(e.question)}</b><span>Answer: ${esc(e.reply)}</span></div></li>`);
    else if (e.kind === "policy" && e.effect === "deny") items.push(`<li class="declined"><span class="hic">${icon("block")}</span><div><b>Blocked by policy</b><span>${esc(e.reason)}</span></div></li>`);
  }
  return items.length ? `<ul class="human">${items.join("")}</ul>` : `<p class="quiet">Nothing needed a human.</p>`;
}

function pretty(a) { try { return JSON.stringify(JSON.parse(a), null, 1); } catch { return String(a ?? ""); } }

function deepHtml(r) {
  const ev = r.events.map((e, i) => ({...e, _i: i}));
  const c = r.contract;
  const contractEv = ev.find(e => e.kind === "contract");
  const done = ev.find(e => e.kind === "complete");
  const verifyKinds = new Set(["verify_start", "verify_step", "verdict"]);

  // turns: group by agent step; policy/approval/network events attach to the turn they happened in
  const turns = []; let cur = null;
  for (const e of ev) {
    if (verifyKinds.has(e.kind) || ["start", "contract", "complete", "lessons", "lessons_queued", "context_clear"].includes(e.kind)) continue;
    if (e.kind === "llm") { cur = {step: e.step, llm: e, items: [], first: e._i}; turns.push(cur); continue; }
    if (cur) cur.items.push(e);
  }
  let prevCost = 0;
  const turnHtml = turns.map(t => {
    const delta = (t.llm.cost_usd ?? prevCost) - prevCost; prevCost = t.llm.cost_usd ?? prevCost;
    const items = t.items.map(e => {
      if (e.kind === "tool") return `<div class="call ${e.ok ? "" : "fail"}" id="e${e._i}"><div class="head"><span class="smark">${icon(e.ok ? "check" : "x")}</span>
          <span class="name">${esc(e.tool)}</span><span class="sum">${esc(e.summary || "")}</span></div>
          ${(e.args || "").length <= 140 ? `<code class="args-inline">${esc(e.args)}</code>` : `<details class="inline"><summary>Arguments (${e.args.length.toLocaleString()} chars)</summary><pre>${esc(pretty(e.args))}</pre></details>`}
          ${e.content ? `<details class="inline"><summary>What the operator saw (${e.content.length.toLocaleString()} chars)</summary><pre>${esc(e.content)}</pre></details>` : ""}
          ${(e.evidence || []).filter(f => f.endsWith(".png")).map(f => { const n = f.split("/").pop(); return `<a href="/files/${esc(r.id)}/screens/${esc(n)}" target="_blank" rel="noopener" class="sum">Screenshot: ${esc(shotName(n))}</a>`; }).join(" ")}</div>`;
      if (e.kind === "policy") return `<div class="flag ${e.effect === "deny" ? "bad" : e.effect === "allow" ? "ok" : ""}" id="e${e._i}">Policy ${esc(e.effect.replace("_", " "))} · rule ${esc(e.rule)}${e.reason ? " — " + esc(e.reason) : ""}<br><span class="sum">${esc(e.request)}</span></div>`;
      if (e.kind === "approval") return `<div class="flag ${e.approved ? "ok" : "bad"}" id="e${e._i}">${e.approved ? "Approved" : "Declined"} by ${esc(e.by)} (rule ${esc(e.rule)})${e.note ? " — " + esc(e.note) : ""}</div>`;
      if (e.kind === "network_block") return `<div class="flag bad" id="e${e._i}">Blocked at the network layer: ${esc(e.method || "")} ${esc(e.url)}</div>`;
      if (e.kind === "ask_human") return `<div class="flag" id="e${e._i}">Asked: ${esc(e.question)} → ${esc(e.reply)}</div>`;
      if (e.kind === "plan") return `<div class="sum" id="e${e._i}">Plan: ${esc(e.subgoal)} → ${esc(e.status)}${e.comment ? " — " + esc(e.comment) : ""}</div>`;
      if (e.kind === "download") return `<div class="sum" id="e${e._i}">Saved file ${esc(e.file.split("/").pop())}</div>`;
      if (e.kind === "error" || e.kind === "cost_cap") return `<div class="flag bad" id="e${e._i}">${esc(e.error)}</div>`;
      return "";
    }).join("");
    return `<article class="panel turn" id="e${t.first}"><header><b>Turn ${t.step}</b><span>${esc(t.llm.at.slice(11))} · ${money(delta)}</span></header>
      <div class="body">${t.llm.content ? `<p class="thought">${esc(t.llm.content)}</p>` : ""}
      ${t.llm.reasoning ? `<details class="inline"><summary>Model reasoning (${t.llm.reasoning.length.toLocaleString()} chars)</summary><pre>${esc(t.llm.reasoning)}</pre></details>` : ""}
      ${items}</div></article>`;
  }).join("");

  const attempts = []; let a = null;
  for (const e of ev) {
    if (e.kind === "verify_start") { a = {start: e, steps: []}; attempts.push(a); }
    else if (e.kind === "verify_step" && a) a.steps.push(e);
    else if (e.kind === "verdict" && a) a.verdict = e;
  }
  const critText = Object.fromEntries((c?.success_criteria || []).map(x => [x.id, x.criterion]));
  const verifyHtml = attempts.map((at, n) => `
    <h3 class="attempt">Attempt ${n + 1}: ${esc(STATUS[at.verdict?.overall] || at.verdict?.overall || "in progress")}</h3>
    <div class="panel"><dl class="kv"><dt>Operator's claim</dt><dd>${esc(at.start.claim?.status || "")} — ${esc(firstLine(at.start.claim?.summary))}</dd>
      <dt>Record changes</dt><dd>${at.start.state_changes?.length ? `<ul>${at.start.state_changes.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "none"}</dd>
      <dt>Verifier lookups</dt><dd><details class="inline"><summary>${at.steps.length} read-only lookups</summary><ul>${at.steps.map(s => `<li>${esc(s.tool)} ${esc(s.args)} → ${esc(s.summary)}</li>`).join("")}</ul></details></dd></dl>
    ${at.verdict ? `<table class="crit-table"><thead><tr><th></th><th>Criterion</th><th>Evidence the verifier observed</th></tr></thead><tbody>
      ${at.verdict.criteria.map(v => `<tr class="${v.met ? "c-met" : "c-unmet"}"><td class="m"><span class="cmark">${icon(v.met ? "check" : "x")}</span></td><td>${esc(v.id)} ${esc(critText[v.id] || "")}</td><td>${esc(v.evidence)}</td></tr>`).join("")}</tbody></table>` : ""}</div>
    ${at.verdict?.unintended_changes?.length ? `<p class="flag bad" style="margin-top:0.6rem">Unintended: ${at.verdict.unintended_changes.map(esc).join("; ")}</p>` : ""}
    ${at.verdict?.notes ? `<p class="sum" style="margin-top:0.6rem">${esc(at.verdict.notes)}</p>` : ""}`).join("");

  const lessonsEv = [...ev].reverse().find(e => e.kind === "lessons");
  const learned = lessonsEv?.lessons || [];
  const queued = !lessonsEv && ev.some(e => e.kind === "lessons_queued");
  const recalled = contractEv?.lessons || [];
  const list = xs => xs?.length ? `<ul>${xs.map(x => `<li>${esc(typeof x === "string" ? x : (x.question || JSON.stringify(x)))}</li>`).join("")}</ul>` : "none";

  return `<div class="deep">
    <div class="jump" aria-label="Jump to section">${["Contract", "Turns", "Verification", "Memory", "Cost"].map(x => `<button data-jump="d-${x.toLowerCase()}">${x}</button>`).join("")}</div>
    <section id="d-contract"><h2>Contract the operator wrote before acting</h2>${c ? `<div class="panel"><dl class="kv">
      <dt>Intended outcome</dt><dd>${esc(c.interpretation)}</dd><dt>Deliverable</dt><dd>${esc(c.deliverable)}</dd>
      <dt>Company documents used</dt><dd>${esc((c.relevant_docs || []).join(", ") || "none")}</dd>
      <dt>Constraints</dt><dd>${list(c.constraints)}</dd>
      <dt>Success criteria</dt><dd><ul>${c.success_criteria.map(x => `<li><b>${esc(x.id)}</b> ${esc(x.criterion)}<br><span class="sum">Checked via: ${esc(x.how_to_check || "—")}</span></li>`).join("")}</ul></dd>
      <dt>Plan</dt><dd><ul>${c.subgoals.map(x => `<li><b>${esc(x.id)}</b> [${esc(x.status || "pending")}] ${esc(x.goal)}${x.comment ? `<br><span class="sum">${esc(x.comment)}</span>` : ""}</li>`).join("")}</ul></dd>
      <dt>Assumptions</dt><dd>${list(c.assumptions)}</dd><dt>Open questions</dt><dd>${list(c.open_questions)}</dd>
      <dt>Amendments</dt><dd>${c.amendments?.length ? `<ul>${c.amendments.map(x => `<li>${esc(x.reason)}</li>`).join("")}</ul>` : "none"}</dd></dl></div>` : "<p class='quiet'>Not drafted yet.</p>"}</section>
    <section id="d-turns"><h2>Every turn (${turns.length})</h2>${turnHtml || "<p class='quiet'>No turns yet.</p>"}</section>
    <section id="d-verification"><h2>Independent verification</h2>${verifyHtml || "<p class='quiet'>Not verified yet.</p>"}</section>
    <section id="d-memory"><h2>Memory</h2><div class="panel"><dl class="kv"><dt>Recalled at start</dt><dd>${recalled.length ? `<ul class="lessons">${recalled.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "nothing relevant"}</dd>
      <dt>Learned from this run</dt><dd>${learned.length ? `<ul class="lessons">${learned.map(x => `<li>${esc(x)}</li>`).join("")}</ul>${lessonsEv.mode === "async" ? `<span class="sum">Distilled in the background after the run finished.</span>` : ""}` : queued ? "Being distilled in the background — the run didn't wait for it." : "nothing yet"}</dd></dl></div></section>
    <section id="d-cost"><h2>Cost</h2><div class="panel"><dl class="kv"><dt>Total</dt><dd>${money(done?.cost_usd ?? 0)}</dd>
      <dt>By model</dt><dd>${done?.cost_by_model ? Object.entries(done.cost_by_model).map(([m, v]) => `${esc(m)}: ${money(v)}`).join("<br>") : "—"}</dd>
      <dt>Tokens</dt><dd>${done?.tokens ? `${done.tokens.prompt.toLocaleString()} prompt (${done.tokens.cached.toLocaleString()} served from cache) · ${done.tokens.completion.toLocaleString()} completion` : "—"}</dd>
      <dt>Models</dt><dd>${ev[0]?.models ? Object.entries(ev[0].models).map(([k, v]) => `${esc(k)}: ${esc(v)}`).join("<br>") : "—"}</dd></dl></div></section>
  </div>`;
}

async function run(id, view = "quick", focusEvent = null) {
  clearInterval(timer); lastRender = ""; stampShown = false;
  const draw = async () => {
    let r; try { r = await api("/api/runs/" + id); } catch (e) { $app.innerHTML = `<p class="empty">This run doesn't exist. <a href="#/">Back to all runs</a></p>`; clearInterval(timer); return; }
    const key = JSON.stringify([r.events.length, r.pending.map(p => p.id), r.status, r.screens.length]);
    if (key === lastRender) return; lastRender = key;
    const openState = [...document.querySelectorAll("details[data-k]")].filter(d => d.open).map(d => d.dataset.k);
    const ev = r.events, start = ev[0] || {}, done = ev.find(e => e.kind === "complete");
    const verdict = [...ev].reverse().find(e => e.kind === "verdict");
    const cost = done?.cost_usd ?? ([...ev].reverse().find(e => "cost_usd" in e) || {}).cost_usd;
    const steps = done?.steps ?? Math.max(0, ...ev.filter(e => e.step).map(e => e.step));
    const final = ["verified", "justified_stop"].includes(r.status);
    const live = ["running", "starting"].includes(r.status);
    const waiting = live && r.pending.length > 0;
    const c = r.contract;
    const vmap = Object.fromEntries((verdict?.criteria || []).map(v => [v.id, v]));
    const claim = (ev.find(e => e.kind === "verify_start") || {}).claim;
    const summary = done?.summary || claim?.summary || "";
    const lastThought = [...ev].reverse().find(e => e.kind === "llm" && e.content);
    const verifying = ev.some(e => e.kind === "verify_start") && !verdict;
    const nToolSteps = ev.filter(e => e.kind === "tool").length;
    const elapsed = start.at ? ago(start.at, (done || ev[ev.length - 1]).at) : "";
    const metCount = (verdict?.criteria || []).filter(v => v.met).length;

    $app.innerHTML = `
      <nav class="crumbs" aria-label="Breadcrumb"><a href="#/">Runs</a>${icon("chevron")}<span>${esc(id)}</span></nav>
      <section class="memo">
        <div>
          <h1 class="ask">${esc(start.request || "")}</h1>
          ${c ? `<p class="goal">${esc(c.interpretation)}</p>` : ""}
          <p class="facts"><span>${icon("steps")}<b>${steps || 0}</b> steps</span><span>${icon("clock")}<b>${elapsed || "—"}</b></span>
            <span>${icon("coin")}<b>${money(cost)}</b> model cost</span>${verdict ? `<span>${icon("shield")}<b>${metCount}/${verdict.criteria.length}</b> checks passed</span>` : ""}</p>
          ${live && !waiting ? `<p class="now"><span class="pulse" aria-hidden="true"></span>${verifying ? "Checking the result independently against the real systems…" : c ? esc(firstLine(lastThought?.content) || "Working…") : "Reading the request and the company's procedures…"}</p>` : ""}
        </div>
        <div class="stamp ${live ? "live" : final ? "ok" : "bad"} ${!live && !stampShown ? "land" : ""}" role="status">${esc(waiting ? STATUS.waiting : STATUS[r.status] || r.status)}</div>
      </section>
      ${r.pending.map(p => approvalHtml(p)).join("")}
      <nav class="tabs" aria-label="Run views"><a href="#/run/${esc(id)}" ${view === "quick" ? 'aria-current="page"' : ""}>Quick view</a>
        <a href="#/run/${esc(id)}/deep" ${view === "deep" ? 'aria-current="page"' : ""}>Deep dive</a></nav>
      ${view === "deep" ? deepHtml(r) : `
      <div class="cols">
        <div class="col">
          <section class="panel card" aria-labelledby="h-progress">
            <h2 class="h2" id="h-progress">Progress</h2>
            ${c ? `<ol class="track">${c.subgoals.map((sg, i) => { const st = sg.status || "pending"; return `
              <li class="t-${esc(st)}"><span class="node" aria-hidden="true">${st === "done" ? icon("check") : st === "blocked" ? icon("x") : i + 1}</span>
                <div class="goal-line">${esc(sg.goal)}${st !== "done" ? `<span class="tag">${esc(st.replace("_", " "))}</span>` : ""}</div>
                ${sg.comment ? `<div class="why" title="${esc(sg.comment)}">${esc(sg.comment)}</div>` : ""}</li>`; }).join("")}</ol>`
              : `<p class="quiet">Working out what done means for this request…</p>`}
            <details class="more" data-k="steps"><summary>${icon("chevron")}Show all ${nToolSteps} actions</summary><ol class="steps">${stepsHtml(ev)}</ol></details>
            ${Object.keys(r.notes || {}).length ? `<details class="more" data-k="notes"><summary>${icon("chevron")}What the operator noted down</summary>
              <ul class="checks">${Object.entries(r.notes).map(([k, v]) => `<li><div class="row"><span></span><span><b>${esc(k.replace(/_/g, " "))}</b><br>${esc(v.value)}</span></div></li>`).join("")}</ul></details>` : ""}
          </section>
        </div>
        <div class="col">
          <section class="panel card" aria-labelledby="h-checks">
            <h2 class="h2" id="h-checks">Checks</h2>
            ${c ? `<ul class="checks">${c.success_criteria.map(x => { const v = vmap[x.id]; const cls = v ? (v.met ? "c-met" : "c-unmet") : "c-pending";
              const mk = `<span class="cmark">${v ? icon(v.met ? "check" : "x") : ""}</span>`;
              return v ? `<li class="${cls}"><details data-k="c-${esc(x.id)}"><summary>${mk}<span>${esc(x.criterion)}</span></summary><p class="ev">${esc(v.evidence)}</p></details></li>`
                       : `<li class="${cls}"><div class="row">${mk}<span>${esc(x.criterion)}</span></div></li>`; }).join("")}</ul>
              ${verdict ? "" : `<p class="quiet" style="margin-top:0.6rem">An independent checker ticks these off against the real systems when the operator finishes.</p>`}` : `<p class="quiet">Appears once the operator has worked out what done means.</p>`}
          </section>
          <section class="panel card" aria-labelledby="h-human"><h2 class="h2" id="h-human">Needed a human</h2>${humanHtml(ev)}</section>
          ${r.screens.length ? `<section class="panel card" aria-labelledby="h-ev"><h2 class="h2" id="h-ev">Evidence</h2><div class="shots">${r.screens.map(s => `<a href="/files/${esc(id)}/screens/${esc(s)}" target="_blank" rel="noopener"><img src="/files/${esc(id)}/screens/${esc(s)}" alt="Screenshot: ${esc(shotName(s))}" loading="lazy"><span>${esc(shotName(s))}</span></a>`).join("")}</div>
            ${summary ? `<details class="more" data-k="summary"><summary>${icon("chevron")}Operator's report</summary><div class="summary">${esc(summary)}</div></details>` : ""}
            ${r.report ? `<details class="more" data-k="report"><summary>${icon("chevron")}Full audit report</summary><pre class="report">${esc(r.report)}</pre></details>` : ""}</section>`
            : summary ? `<section class="panel card"><h2 class="h2">Operator's report</h2><div class="summary">${esc(summary)}</div></section>` : ""}
        </div>
      </div>`}`;
    document.querySelectorAll("[data-jump]").forEach(b => b.onclick = () => document.getElementById(b.dataset.jump)?.scrollIntoView({behavior: "smooth"}));
    if (focusEvent !== null) { const el = document.getElementById("e" + focusEvent); if (el) { el.scrollIntoView({block: "center"}); el.closest(".turn")?.classList.add("flash"); el.closest("details")?.setAttribute("open", ""); } focusEvent = null; }
    openState.forEach(k => { const d = document.querySelector(`details[data-k="${k}"]`); if (d) d.open = true; });
    if (!live) stampShown = true;
    document.querySelectorAll("[data-decide]").forEach(b => b.onclick = async () => {
      const rid = b.dataset.decide;
      b.closest(".await")?.querySelectorAll("button").forEach(x => x.disabled = true);
      await api(`/api/runs/${id}/approvals/${rid}`, {method: "POST", headers: {"content-type": "application/json"},
        body: JSON.stringify({approved: b.dataset.ok === "1", text: document.getElementById("note-" + rid)?.value || ""})});
      lastRender = ""; draw();
    });
    document.querySelectorAll("[data-answer]").forEach(b => b.onclick = async () => {
      const rid = b.dataset.answer;
      b.disabled = true;
      await api(`/api/runs/${id}/approvals/${rid}`, {method: "POST", headers: {"content-type": "application/json"},
        body: JSON.stringify({approved: true, text: document.getElementById("ans-" + rid)?.value || ""})});
      lastRender = ""; draw();
    });
    if (!live && !r.pending.length) clearInterval(timer);
  };
  await draw(); timer = setInterval(draw, 1200);
}

function route() {
  const h = location.hash;
  let m;
  if ((m = h.match(/^#\/run\/([^/]+)\/deep(?:\/e(\d+))?$/))) return run(decodeURIComponent(m[1]), "deep", m[2] ? +m[2] : null);
  if ((m = h.match(/^#\/run\/([^/]+)$/))) return run(decodeURIComponent(m[1]));
  home();
}
window.addEventListener("hashchange", route); route();
</script>
</body>
</html>
