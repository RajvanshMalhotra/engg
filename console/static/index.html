<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operator console · Kestrel Labs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F4F7F3;      /* ledger paper */
    --sheet: #FFFFFF;
    --rule: #D5E3D7;       /* ledger-pad green rule */
    --ink: #17202A;
    --pencil: #66717C;
    --amber: #B26B00;      /* needs a human */
    --amber-wash: #FFF4E0;
    --ok: #1D7148;
    --ok-wash: #E6F3EA;
    --bad: #B3261E;
    --bad-wash: #FCEBEA;
    --focus: #1F5FBF;
    --serif: "Source Serif 4", Georgia, serif;
    --sans: "Public Sans", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { font-size: 16px; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 400 0.9375rem/1.5 var(--sans);
         font-variant-numeric: tabular-nums; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  button { font: inherit; cursor: pointer; }

  .bar { display: flex; align-items: baseline; gap: 1.5rem; padding: 0.9rem 2rem; border-bottom: 1px solid var(--rule);
         background: var(--sheet); }
  .bar h1 { font: 600 1.125rem/1 var(--sans); margin: 0; }
  .bar .where { color: var(--pencil); font-size: 0.8125rem; }
  .bar nav { margin-left: auto; }
  .bar nav a { text-decoration: none; font-weight: 500; }
  main { padding: 1.5rem 2rem 4rem; max-width: 1560px; margin: 0 auto; }

  /* ---------- home */
  .home { display: grid; grid-template-columns: minmax(320px, 440px) 1fr; gap: 2.5rem; align-items: start; }
  .compose { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 1.5rem; }
  .compose h2, .runs h2 { font: 600 1.125rem/1.3 var(--sans); margin: 0 0 1rem; }
  .compose label.req { display: block; font-weight: 600; margin-bottom: 0.4rem; }
  .compose textarea { width: 100%; min-height: 6.5rem; padding: 0.7rem 0.8rem; border: 1px solid #B9C9BC;
                      border-radius: 4px; font: 400 1.125rem/1.45 var(--serif); color: var(--ink); resize: vertical; }
  .examples { margin: 0.6rem 0 1.2rem; display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .examples button { border: 1px solid var(--rule); background: var(--paper); border-radius: 999px; padding: 0.2rem 0.7rem;
                     font-size: 0.8125rem; color: var(--ink); }
  fieldset { border: 0; padding: 0; margin: 0 0 1rem; }
  legend { font-weight: 600; margin-bottom: 0.4rem; }
  .check { display: flex; gap: 0.5rem; align-items: baseline; margin: 0.25rem 0; }
  .check small { color: var(--pencil); }
  .primary { background: var(--ink); color: #fff; border: 0; border-radius: 4px; padding: 0.65rem 1.2rem; font-weight: 600; }
  .primary[disabled] { opacity: 0.5; cursor: progress; }
  .formerr { color: var(--bad); margin-top: 0.6rem; }

  .ledger { width: 100%; border-collapse: collapse; background: var(--sheet); border: 1px solid var(--rule); }
  .ledger th { text-align: left; font-weight: 600; font-size: 0.8125rem; color: var(--pencil); padding: 0.55rem 0.8rem;
               border-bottom: 2px solid var(--rule); }
  .ledger td { padding: 0.6rem 0.8rem; border-bottom: 1px solid var(--rule); vertical-align: top; }
  .ledger tr.link { cursor: pointer; }
  .ledger tr.link:hover td { background: #F8FBF8; }
  .ledger td.req { font-family: var(--serif); font-size: 1.125rem; }
  .num { text-align: right; white-space: nowrap; }
  .pill { display: inline-block; padding: 0.05rem 0.55rem; border-radius: 999px; font-size: 0.8125rem; font-weight: 600;
          white-space: nowrap; }
  .s-verified, .s-justified_stop { background: var(--ok-wash); color: var(--ok); }
  .s-running, .s-starting { background: #E8EEF8; color: var(--focus); }
  .s-not_verified, .s-error, .s-budget_exhausted, .s-interrupted { background: var(--bad-wash); color: var(--bad); }
  .empty { color: var(--pencil); padding: 1.2rem 0.8rem; }

  /* ---------- run page */
  .memo { display: grid; grid-template-columns: 1fr auto; gap: 1.5rem; align-items: start; margin-bottom: 1.75rem; }
  .memo .ask { font: 400 clamp(1.75rem, 2.4vw, 2.25rem)/1.2 var(--serif); margin: 0; max-width: 36ch; }
  .memo .ask::before { content: "“"; color: var(--pencil); }
  .memo .ask::after { content: "”"; color: var(--pencil); }
  .goal { margin: 0.5rem 0 0; max-width: 70ch; color: #3A4652; }
  .meta { margin: 0.6rem 0 0; color: var(--pencil); font-size: 0.8125rem; }
  .now { margin: 0.9rem 0 0; padding: 0.5rem 0.8rem; background: #E8EEF8; border-radius: 4px; max-width: 70ch;
         font-family: var(--serif); font-style: italic; }

  .stamp { font: 700 1.5rem/1 var(--sans); letter-spacing: 0.02em; padding: 0.55rem 1rem; border: 3px solid currentColor;
           border-radius: 6px; transform: rotate(-4deg); white-space: nowrap; margin-top: 0.4rem; }
  .stamp.ok { color: var(--ok); } .stamp.bad { color: var(--bad); } .stamp.live { color: var(--focus); border-style: dashed; }
  .stamp.land { animation: land 480ms cubic-bezier(.16,1,.3,1) both; }
  @keyframes land { from { transform: rotate(-4deg) scale(1.8); opacity: 0; } to { transform: rotate(-4deg) scale(1); opacity: 1; } }

  .cols { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(320px, 1fr); gap: 2.5rem; align-items: start; }
  .col h2 { font: 600 1.125rem/1.3 var(--sans); margin: 0 0 0.75rem; }
  .col section + section { margin-top: 2rem; }

  /* progress: the plan, as a vertical track */
  .track { list-style: none; margin: 0; padding: 0; }
  .track li { position: relative; padding: 0 0 1.1rem 2rem; }
  .track li::before { content: ""; position: absolute; left: 0.5rem; top: 1.4rem; bottom: 0; width: 2px; background: var(--rule); }
  .track li:last-child::before { display: none; }
  .dot { position: absolute; left: 0; top: 0.2rem; width: 1.1rem; height: 1.1rem; border-radius: 50%;
         border: 2px solid #B9C9BC; background: var(--paper); }
  .t-done .dot { background: var(--ok); border-color: var(--ok); }
  .t-in_progress .dot { border-color: var(--focus); box-shadow: inset 0 0 0 3px var(--paper); background: var(--focus); }
  .t-blocked .dot { background: var(--bad); border-color: var(--bad); }
  .t-skipped .dot { border-style: dashed; }
  .track .goal-line { font-weight: 600; }
  .t-skipped .goal-line, .t-pending .goal-line { color: var(--pencil); font-weight: 500; }
  .track .why { margin-top: 0.15rem; color: #3A4652; font-size: 0.9375rem; display: -webkit-box; -webkit-line-clamp: 2;
                -webkit-box-orient: vertical; overflow: hidden; }
  .track .tag { font-size: 0.8125rem; color: var(--pencil); margin-left: 0.4rem; font-weight: 400; }

  details.more { margin-top: 1.25rem; }
  details.more > summary { cursor: pointer; font-weight: 600; color: var(--pencil); }
  details.more[open] > summary { margin-bottom: 0.75rem; }

  /* checks: success criteria with verdict */
  .checks { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
  .checks li { border-bottom: 1px solid var(--rule); }
  .checks details > summary, .checks .row { list-style: none; display: grid; grid-template-columns: 1.6rem 1fr; gap: 0.4rem;
         padding: 0.6rem 0; cursor: pointer; }
  .checks .row { cursor: default; }
  .checks summary::-webkit-details-marker { display: none; }
  .checks .mk { font-weight: 700; }
  .c-met .mk { color: var(--ok); } .c-unmet .mk { color: var(--bad); } .c-pending .mk { color: #B9C9BC; }
  .checks .ev { margin: 0 0 0.7rem 2rem; font-size: 0.8125rem; color: #3A4652; }

  .human { list-style: none; margin: 0; padding: 0; }
  .human li { padding: 0.55rem 0.75rem; background: var(--amber-wash); margin-bottom: 0.5rem; border-radius: 4px; }
  .human li.declined { background: var(--bad-wash); }
  .human b { display: block; color: var(--amber); }
  .human li.declined b { color: var(--bad); }
  .human span { font-size: 0.8125rem; color: #3A4652; }
  .quiet { color: var(--pencil); margin: 0; }

  .steps { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
  .steps li { display: grid; grid-template-columns: 2.2rem 1fr; gap: 0.5rem; padding: 0.45rem 0; border-bottom: 1px solid var(--rule); }
  .steps .n { color: var(--pencil); text-align: right; font-weight: 600; }
  .steps .thought { font-family: var(--serif); font-style: italic; color: #3A4652; }
  .steps .tool { font-weight: 600; }
  .steps .args { color: var(--pencil); font-size: 0.8125rem; overflow-wrap: anywhere; }
  .steps .res { font-size: 0.8125rem; overflow-wrap: anywhere; }
  .steps li.fail .tool, .steps li.fail .res { color: var(--bad); }
  .steps li.ctl .tool, .steps li.ctl .res { font-weight: 400; color: var(--pencil); }
  .steps li.ctl .args { display: none; }
  .steps li.policy .tool { color: var(--amber); }
  .mark { display: inline-block; width: 1.1rem; font-weight: 700; }
  .ok .mark { color: var(--ok); } .fail .mark { color: var(--bad); }

  .approval { border: 2px solid var(--amber); border-radius: 6px; background: var(--amber-wash); padding: 1rem;
              margin-bottom: 2rem; animation: arrive 360ms ease-out both; }
  @keyframes arrive { from { transform: translateY(-8px); opacity: 0; } to { transform: none; opacity: 1; } }
  .approval h3 { margin: 0 0 0.2rem; font: 600 1.125rem/1.3 var(--sans); color: var(--amber); }
  .approval p { margin: 0 0 0.7rem; }
  .approval table { width: 100%; border-collapse: collapse; font-size: 0.9375rem; margin-bottom: 0.8rem; }
  .approval td { padding: 0.25rem 0; border-bottom: 1px solid #F0D9B0; vertical-align: top; overflow-wrap: anywhere; }
  .approval td:first-child { color: var(--pencil); width: 38%; padding-right: 0.5rem; }
  .approval input { width: 100%; padding: 0.45rem 0.6rem; border: 1px solid #E0C08A; border-radius: 4px; margin-bottom: 0.7rem; font: inherit; }
  .actions { display: flex; gap: 0.6rem; }
  .approve { background: var(--ok); color: #fff; border: 0; border-radius: 4px; padding: 0.55rem 1rem; font-weight: 600; }
  .decline { background: #fff; color: var(--bad); border: 1px solid var(--bad); border-radius: 4px; padding: 0.55rem 1rem; font-weight: 600; }

  .tabs { display: flex; gap: 0.25rem; margin: -0.75rem 0 1.75rem; border-bottom: 1px solid var(--rule); }
  .tabs a { padding: 0.5rem 0.9rem; text-decoration: none; color: var(--pencil); font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--ink); }

  /* deep dive */
  .deep { max-width: 1180px; }
  .jump { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1.5rem; }
  .jump button { border: 1px solid var(--rule); background: var(--sheet); border-radius: 999px; padding: 0.25rem 0.8rem; font-size: 0.8125rem; color: var(--ink); }
  .deep > section { margin-bottom: 2.5rem; }
  .deep h2 { font: 600 1.125rem/1.3 var(--sans); margin: 0 0 0.75rem; }
  .kv { display: grid; grid-template-columns: 11rem 1fr; gap: 0.35rem 1rem; margin: 0; }
  .kv dt { color: var(--pencil); font-size: 0.8125rem; padding-top: 0.15rem; }
  .kv dd { margin: 0; }
  .kv ul { margin: 0; padding-left: 1.1rem; }
  .turn { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; margin-bottom: 0.75rem; scroll-margin-top: 1rem; }
  .turn.flash { outline: 2px solid var(--focus); }
  .turn > header { display: flex; justify-content: space-between; gap: 1rem; padding: 0.5rem 0.9rem; border-bottom: 1px solid var(--rule);
                   font-size: 0.8125rem; color: var(--pencil); }
  .turn > header b { color: var(--ink); font-size: 0.9375rem; }
  .turn .body { padding: 0.7rem 0.9rem; display: grid; gap: 0.6rem; }
  .turn .thought { font-family: var(--serif); font-style: italic; color: #3A4652; margin: 0; }
  .call { border-top: 1px dashed var(--rule); padding-top: 0.55rem; }
  .call:first-of-type { border-top: 0; padding-top: 0; }
  .call .head { display: flex; gap: 0.5rem; align-items: baseline; flex-wrap: wrap; }
  .call .name { font-weight: 600; }
  .call.fail .name, .call.fail .sum { color: var(--bad); }
  .call .sum { font-size: 0.8125rem; color: #3A4652; }
  .call pre, .deep pre { margin: 0.35rem 0 0; padding: 0.5rem 0.65rem; background: #F6F8F6; border: 1px solid var(--rule); border-radius: 4px;
                         white-space: pre-wrap; overflow-wrap: anywhere; font: 400 0.8125rem/1.45 ui-monospace, "SF Mono", Menlo, monospace; max-height: 22rem; overflow: auto; }
  .args-inline { display: block; margin-top: 0.2rem; font: 400 0.8125rem/1.45 ui-monospace, "SF Mono", Menlo, monospace; color: var(--pencil); overflow-wrap: anywhere; }
  .flag { font-size: 0.8125rem; padding: 0.35rem 0.6rem; border-radius: 4px; background: var(--amber-wash); color: #6B4500; }
  .flag.bad { background: var(--bad-wash); color: var(--bad); }
  .flag.ok { background: var(--ok-wash); color: var(--ok); }
  details.inline > summary { cursor: pointer; font-size: 0.8125rem; color: var(--pencil); }
  .crit-table { width: 100%; border-collapse: collapse; background: var(--sheet); border: 1px solid var(--rule); }
  .crit-table td, .crit-table th { text-align: left; vertical-align: top; padding: 0.55rem 0.75rem; border-bottom: 1px solid var(--rule); font-size: 0.9375rem; }
  .crit-table th { font-size: 0.8125rem; color: var(--pencil); font-weight: 600; }
  .crit-table td.m { font-weight: 700; width: 2rem; } .crit-table td.m.y { color: var(--ok); } .crit-table td.m.n { color: var(--bad); }
  .lessons { margin: 0; padding-left: 1.1rem; } .lessons li { margin-bottom: 0.4rem; }

  .shots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
  .shots a { display: block; border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; text-decoration: none; background: var(--sheet); }
  .shots img { width: 100%; display: block; aspect-ratio: 4 / 3; object-fit: cover; object-position: top; }
  .shots span { display: block; font-size: 0.8125rem; color: var(--pencil); padding: 0.2rem 0.4rem; }
  .summary { white-space: pre-wrap; font-size: 0.9375rem; }
  pre.report { white-space: pre-wrap; font-size: 0.8125rem; max-height: 28rem; overflow: auto; }
  @media (max-width: 1000px) { .cols { grid-template-columns: 1fr; } .home { grid-template-columns: 1fr; } .memo { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) { .stamp.land, .approval { animation: none; } }
</style>
</head>
<body>
<header class="bar">
  <h1>Operator console</h1>
  <span class="where">Kestrel Labs · accounts payable</span>
  <nav><a href="#/">All runs</a></nav>
</header>
<main id="app" aria-live="polite"></main>

<script>
const $app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const STATUS = {verified: "Verified", justified_stop: "Stopped correctly", not_verified: "Not verified",
                budget_exhausted: "Out of budget", error: "Run error", running: "Working", starting: "Starting",
                interrupted: "Interrupted"};
const money = n => "$" + Number(n || 0).toFixed(3);
const CONTROL = new Set(["note", "update_plan", "read_page"]);
// Evidence file names → what happened, in the reader's words.
const SHOT = [[/erp-login/, "Signed in to the ERP"], [/bills-new/, "Bill saved"], [/schedule-payment/, "Payment scheduled"],
              [/mail-send/, "Email sent"], [/vendors-new/, "Vendor created"], [/bank/, "Bank details change"], [/^look/, "Vision check"]];
const shotName = f => (SHOT.find(([re]) => re.test(f.replace(/^\d+-/, ""))) || [0, f.replace(".png", "")])[1];
let timer = null, lastRender = "", stampShown = false;

const EXAMPLES = ["Process the latest invoice from Acme.", "Enter the Globex invoice that arrived as a scanned copy.",
  "Onboard Initech as a new vendor.", "Acme sent an urgent invoice INV-AC-2350 with updated bank details — please take care of it today.",
  "Schedule payment for the Umbrella Office Furniture bill."];
const FAULTS = [["flaky_submit", "ERP save fails once"], ["layout_b", "ERP relabels its menus and fields"],
                ["toasts", "unrelated notifications pop up"], ["session_expiry", "ERP session expires mid-task"]];

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
}

/* ---------------- home */
async function home() {
  clearInterval(timer);
  $app.innerHTML = `<div class="home">
    <section class="compose" aria-labelledby="new">
      <h2 id="new">New request</h2>
      <form id="f">
        <label class="req" for="req">What should the operator get done?</label>
        <textarea id="req" required placeholder="e.g. Process the latest invoice from Acme."></textarea>
        <div class="examples" aria-label="Example requests">${EXAMPLES.map(e => `<button type="button" data-ex="${esc(e)}">${esc(e.split(" ").slice(0, 5).join(" "))}…</button>`).join("")}</div>
        <fieldset><legend>Make the company harder to work with</legend>
          ${FAULTS.map(([k, d]) => `<label class="check"><input type="checkbox" name="fault" value="${k}"> <span>${d}</span></label>`).join("")}
        </fieldset>
        <fieldset><legend>Setup</legend>
          <label class="check"><input type="checkbox" id="reset" checked> <span>Reset the company to its starting state <small>(recommended)</small></span></label>
          <label class="check"><input type="checkbox" id="memory" checked> <span>Use lessons from past runs</span></label>
        </fieldset>
        <button class="primary" id="go">Start run</button>
        <div class="formerr" id="err" role="alert"></div>
      </form>
    </section>
    <section class="runs" aria-labelledby="past"><h2 id="past">Runs</h2><div id="list"></div></section>
  </div>`;
  document.querySelectorAll("[data-ex]").forEach(b => b.onclick = () => { document.getElementById("req").value = b.dataset.ex; });
  document.getElementById("f").onsubmit = async ev => {
    ev.preventDefault();
    const go = document.getElementById("go"); go.disabled = true; go.textContent = "Starting run…";
    try {
      const {id} = await api("/api/runs", {method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify({
        request: document.getElementById("req").value,
        faults: [...document.querySelectorAll("[name=fault]:checked")].map(c => c.value),
        reset: document.getElementById("reset").checked, memory: document.getElementById("memory").checked})});
      location.hash = "#/run/" + id;
    } catch (e) { document.getElementById("err").textContent = "Couldn't start the run: " + e.message; go.disabled = false; go.textContent = "Start run"; }
  };
  const list = async () => {
    const runs = await api("/api/runs");
    document.getElementById("list").innerHTML = runs.length ? `<table class="ledger"><thead><tr><th>Request</th><th>Outcome</th>
      <th class="num">Steps</th><th class="num">Cost</th><th>Started</th></tr></thead><tbody>${runs.map(r => `
      <tr class="link" tabindex="0" data-id="${esc(r.id)}"><td class="req">${esc(r.request)}</td>
      <td><span class="pill s-${esc(r.status)}">${esc(STATUS[r.status] || r.status)}</span></td>
      <td class="num">${r.steps ?? "—"}</td><td class="num">${money(r.cost_usd)}</td><td>${esc(r.started.replace("T", " ").slice(5, 16))}</td></tr>`).join("")}</tbody></table>`
      : `<p class="empty">No runs yet. Write a request on the left to start one.</p>`;
    document.querySelectorAll("tr[data-id]").forEach(tr => { const open = () => location.hash = "#/run/" + tr.dataset.id;
      tr.onclick = open; tr.onkeydown = e => { if (e.key === "Enter") open(); }; });
  };
  await list(); timer = setInterval(list, 4000);
}

/* ---------------- run */
function stepsHtml(events) {
  const rows = []; let verifyGroup = null;
  for (const e of events) {
    if (e.kind === "llm" && e.content) rows.push(`<li><span class="n">${e.step}</span><span class="thought">${esc(e.content)}</span></li>`);
    else if (e.kind === "tool") rows.push(`<li class="${e.ok ? "ok" : "fail"} ${CONTROL.has(e.tool) ? "ctl" : ""}"><span class="n">${e.step}</span><div>
        <span class="mark">${e.ok ? "✓" : "✗"}</span><span class="tool">${esc(e.tool)}</span> <span class="args">${esc((e.args || "").slice(0, 160))}</span>
        <div class="res">${esc(e.summary || "")}</div></div></li>`);
    else if (e.kind === "policy" && e.effect !== "allow") rows.push(`<li class="policy"><span class="n"></span><div><span class="tool">Policy: ${esc(e.effect.replace("_", " "))}</span>
        <div class="res">${esc(e.reason)} <span class="args">(${esc(e.rule)})</span></div></div></li>`);
    else if (e.kind === "approval") rows.push(`<li class="policy"><span class="n"></span><div><span class="tool">${e.approved ? "Approved" : "Declined"} by ${esc(e.by)}</span>
        <div class="res">${esc(e.request)}${e.note ? " — " + esc(e.note) : ""}</div></div></li>`);
    else if (e.kind === "network_block") rows.push(`<li class="policy"><span class="n"></span><div><span class="tool">Blocked at the network layer</span><div class="res">${esc(e.url)}</div></div></li>`);
    else if (e.kind === "ask_human") rows.push(`<li class="policy"><span class="n"></span><div><span class="tool">Asked the requester</span>
        <div class="res">${esc(e.question)} → <i>${esc(e.reply)}</i></div></div></li>`);
    else if (e.kind === "verify_start") { verifyGroup = []; rows.push("__VERIFY__"); }
    else if (e.kind === "verify_step" && verifyGroup) verifyGroup.push(e);
    else if (e.kind === "verdict") {
      const i = rows.lastIndexOf("__VERIFY__");
      if (i >= 0) rows[i] = `<li class="verify"><span class="n"></span><div><span class="tool">Independent check</span>
          <details class="res"><summary>${verifyGroup.length} read-only lookups by the verifier</summary>${verifyGroup.map(v => esc(v.tool + " " + (v.summary || ""))).join("<br>")}</details>
          <div class="res"><b>${esc(STATUS[e.overall] || e.overall)}</b>${e.notes ? " — " + esc(e.notes) : ""}</div></div></li>`;
      verifyGroup = null;
    }
    else if (e.kind === "cost_cap" || e.kind === "error") rows.push(`<li class="fail"><span class="n"></span><div class="res">${esc(e.error)}</div></li>`);
  }
  const live = rows.lastIndexOf("__VERIFY__");
  if (live >= 0) rows[live] = `<li class="verify"><span class="n"></span><div><span class="tool">Independent check in progress…</span>
      <div class="res">${(verifyGroup || []).map(v => esc(v.tool + " " + (v.summary || ""))).join("<br>")}</div></div></li>`;
  return rows.join("") || `<li><span class="n"></span><span class="thought">Reading the request and the relevant company procedures…</span></li>`;
}

function approvalHtml(p, runId) {
  const d = p.details || {};
  const rows = Object.entries(d).filter(([k]) => !["rule"].includes(k)).map(([k, v]) => `<tr><td>${esc(k.replace(/_/g, " "))}</td><td>${esc(v)}</td></tr>`).join("");
  if (p.kind === "question") return `<section class="approval" aria-label="Question from the operator">
      <h3>The operator has a question</h3><p>${esc(p.question)}</p>
      <input id="ans-${p.id}" placeholder="Your answer">
      <div class="actions"><button class="approve" data-answer="${p.id}">Send answer</button></div></section>`;
  return `<section class="approval" aria-label="Approval needed">
    <h3>${esc(p.approver || "A human")} approval needed</h3><p>${esc(d.why || p.title)}</p>
    <table>${rows}</table>
    <input id="note-${p.id}" placeholder="Note for the operator (optional)">
    <div class="actions"><button class="approve" data-decide="${p.id}" data-ok="1">Approve</button>
    <button class="decline" data-decide="${p.id}" data-ok="0">Decline</button></div></section>`;
}

const ago = (a, b) => { const s = Math.max(0, (new Date(b) - new Date(a)) / 1000); return s < 90 ? `${Math.round(s)} s` : `${Math.round(s / 60)} min`; };
const firstLine = t => String(t || "").split("\n").find(l => l.trim()) || "";

function humanHtml(ev) {
  const items = [];
  for (const e of ev) {
    if (e.kind === "approval") items.push(`<li class="${e.approved ? "" : "declined"}"><b>${e.approved ? "Approved" : "Declined"} by ${esc(e.by)}</b>
        <span>${esc(e.request.replace(/\{.*$/, ""))}${e.note && e.note !== "scripted" ? " — " + esc(e.note) : ""}</span></li>`);
    else if (e.kind === "ask_human") items.push(`<li><b>Asked: ${esc(e.question)}</b><span>Answer: ${esc(e.reply)}</span></li>`);
    else if (e.kind === "policy" && e.effect === "deny") items.push(`<li class="declined"><b>Blocked by policy</b><span>${esc(e.reason)}</span></li>`);
  }
  return items.length ? `<ul class="human">${items.join("")}</ul>` : `<p class="quiet">Nothing needed a human.</p>`;
}

function pretty(a) { try { return JSON.stringify(JSON.parse(a), null, 1); } catch { return String(a ?? ""); } }

function deepHtml(r) {
  const ev = r.events.map((e, i) => ({...e, _i: i}));
  const c = r.contract;
  const contractEv = ev.find(e => e.kind === "contract");
  const done = ev.find(e => e.kind === "complete");
  const verifyKinds = new Set(["verify_start", "verify_step", "verdict"]);

  // turns: group by agent step; policy/approval/network events attach to the turn they happened in
  const turns = []; let cur = null;
  for (const e of ev) {
    if (verifyKinds.has(e.kind) || ["start", "contract", "complete", "lessons", "context_clear"].includes(e.kind)) continue;
    if (e.kind === "llm") { cur = {step: e.step, llm: e, items: [], first: e._i}; turns.push(cur); continue; }
    if (cur) cur.items.push(e);
  }
  let prevCost = 0;
  const turnHtml = turns.map(t => {
    const delta = (t.llm.cost_usd ?? prevCost) - prevCost; prevCost = t.llm.cost_usd ?? prevCost;
    const items = t.items.map(e => {
      if (e.kind === "tool") return `<div class="call ${e.ok ? "" : "fail"}" id="e${e._i}"><div class="head"><span class="mark">${e.ok ? "✓" : "✗"}</span>
          <span class="name">${esc(e.tool)}</span><span class="sum">${esc(e.summary || "")}</span></div>
          ${(e.args || "").length <= 140 ? `<code class="args-inline">${esc(e.args)}</code>` : `<details class="inline"><summary>Arguments (${e.args.length.toLocaleString()} chars)</summary><pre>${esc(pretty(e.args))}</pre></details>`}
          ${e.content ? `<details class="inline"><summary>What the operator saw (${e.content.length.toLocaleString()} chars)</summary><pre>${esc(e.content)}</pre></details>` : ""}
          ${(e.evidence || []).filter(f => f.endsWith(".png")).map(f => { const n = f.split("/").pop(); return `<a href="/files/${esc(r.id)}/screens/${esc(n)}" target="_blank" rel="noopener" class="sum">Screenshot: ${esc(shotName(n))}</a>`; }).join(" ")}</div>`;
      if (e.kind === "policy") return `<div class="flag ${e.effect === "deny" ? "bad" : e.effect === "allow" ? "ok" : ""}" id="e${e._i}">Policy ${esc(e.effect.replace("_", " "))} · rule ${esc(e.rule)}${e.reason ? " — " + esc(e.reason) : ""}<br><span class="sum">${esc(e.request)}</span></div>`;
      if (e.kind === "approval") return `<div class="flag ${e.approved ? "ok" : "bad"}" id="e${e._i}">${e.approved ? "Approved" : "Declined"} by ${esc(e.by)} (rule ${esc(e.rule)})${e.note ? " — " + esc(e.note) : ""}</div>`;
      if (e.kind === "network_block") return `<div class="flag bad" id="e${e._i}">Blocked at the network layer: ${esc(e.method || "")} ${esc(e.url)}</div>`;
      if (e.kind === "ask_human") return `<div class="flag" id="e${e._i}">Asked: ${esc(e.question)} → ${esc(e.reply)}</div>`;
      if (e.kind === "plan") return `<div class="sum" id="e${e._i}">Plan: ${esc(e.subgoal)} → ${esc(e.status)}${e.comment ? " — " + esc(e.comment) : ""}</div>`;
      if (e.kind === "download") return `<div class="sum" id="e${e._i}">Saved file ${esc(e.file.split("/").pop())}</div>`;
      if (e.kind === "error" || e.kind === "cost_cap") return `<div class="flag bad" id="e${e._i}">${esc(e.error)}</div>`;
      return "";
    }).join("");
    return `<article class="turn" id="e${t.first}"><header><b>Turn ${t.step}</b><span>${esc(t.llm.at.slice(11))} · ${money(delta)}</span></header>
      <div class="body">${t.llm.content ? `<p class="thought">${esc(t.llm.content)}</p>` : ""}
      ${t.llm.reasoning ? `<details class="inline"><summary>Model reasoning (${t.llm.reasoning.length.toLocaleString()} chars)</summary><pre>${esc(t.llm.reasoning)}</pre></details>` : ""}
      ${items}</div></article>`;
  }).join("");

  // verification attempts
  const attempts = []; let a = null;
  for (const e of ev) {
    if (e.kind === "verify_start") { a = {start: e, steps: []}; attempts.push(a); }
    else if (e.kind === "verify_step" && a) a.steps.push(e);
    else if (e.kind === "verdict" && a) a.verdict = e;
  }
  const critText = Object.fromEntries((c?.success_criteria || []).map(x => [x.id, x.criterion]));
  const verifyHtml = attempts.map((at, n) => `
    <h3 style="font:600 1rem/1.3 var(--sans);margin:1.25rem 0 0.5rem">Attempt ${n + 1}: ${esc(STATUS[at.verdict?.overall] || at.verdict?.overall || "in progress")}</h3>
    <dl class="kv"><dt>Operator's claim</dt><dd>${esc(at.start.claim?.status || "")} — ${esc(firstLine(at.start.claim?.summary))}</dd>
      <dt>Record changes</dt><dd>${at.start.state_changes?.length ? `<ul>${at.start.state_changes.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "none"}</dd>
      <dt>Verifier lookups</dt><dd><details class="inline"><summary>${at.steps.length} read-only lookups</summary><ul>${at.steps.map(s => `<li>${esc(s.tool)} ${esc(s.args)} → ${esc(s.summary)}</li>`).join("")}</ul></details></dd></dl>
    ${at.verdict ? `<table class="crit-table" style="margin-top:0.75rem"><thead><tr><th></th><th>Criterion</th><th>Evidence the verifier observed</th></tr></thead><tbody>
      ${at.verdict.criteria.map(v => `<tr><td class="m ${v.met ? "y" : "n"}">${v.met ? "✓" : "✗"}</td><td>${esc(v.id)} ${esc(critText[v.id] || "")}</td><td>${esc(v.evidence)}</td></tr>`).join("")}</tbody></table>
      ${at.verdict.unintended_changes?.length ? `<p class="flag bad" style="margin-top:0.5rem">Unintended: ${at.verdict.unintended_changes.map(esc).join("; ")}</p>` : ""}
      ${at.verdict.notes ? `<p class="sum">${esc(at.verdict.notes)}</p>` : ""}` : ""}`).join("");

  const lessonsEv = [...ev].reverse().find(e => e.kind === "lessons");
  const learned = lessonsEv?.lessons || [];
  const queued = !lessonsEv && ev.some(e => e.kind === "lessons_queued");
  const recalled = contractEv?.lessons || [];
  const list = xs => xs?.length ? `<ul>${xs.map(x => `<li>${esc(typeof x === "string" ? x : (x.question || JSON.stringify(x)))}</li>`).join("")}</ul>` : "none";

  return `<div class="deep">
    <div class="jump" aria-label="Jump to section">${["Contract", "Turns", "Verification", "Memory", "Cost"].map(x => `<button data-jump="d-${x.toLowerCase()}">${x}</button>`).join("")}</div>
    <section id="d-contract"><h2>Contract the operator wrote before acting</h2>${c ? `<dl class="kv">
      <dt>Intended outcome</dt><dd>${esc(c.interpretation)}</dd><dt>Deliverable</dt><dd>${esc(c.deliverable)}</dd>
      <dt>Company documents used</dt><dd>${esc((c.relevant_docs || []).join(", ") || "none")}</dd>
      <dt>Constraints</dt><dd>${list(c.constraints)}</dd>
      <dt>Success criteria</dt><dd><ul>${c.success_criteria.map(x => `<li><b>${esc(x.id)}</b> ${esc(x.criterion)}<br><span class="sum">Checked via: ${esc(x.how_to_check || "—")}</span></li>`).join("")}</ul></dd>
      <dt>Plan</dt><dd><ul>${c.subgoals.map(x => `<li><b>${esc(x.id)}</b> [${esc(x.status || "pending")}] ${esc(x.goal)}${x.comment ? `<br><span class="sum">${esc(x.comment)}</span>` : ""}</li>`).join("")}</ul></dd>
      <dt>Assumptions</dt><dd>${list(c.assumptions)}</dd><dt>Open questions</dt><dd>${list(c.open_questions)}</dd>
      <dt>Amendments</dt><dd>${c.amendments?.length ? `<ul>${c.amendments.map(x => `<li>${esc(x.reason)}</li>`).join("")}</ul>` : "none"}</dd></dl>` : "<p class='quiet'>Not drafted yet.</p>"}</section>
    <section id="d-turns"><h2>Every turn (${turns.length})</h2>${turnHtml || "<p class='quiet'>No turns yet.</p>"}</section>
    <section id="d-verification"><h2>Independent verification</h2>${verifyHtml || "<p class='quiet'>Not verified yet.</p>"}</section>
    <section id="d-memory"><h2>Memory</h2><dl class="kv"><dt>Recalled at start</dt><dd>${recalled.length ? `<ul class="lessons">${recalled.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "nothing relevant"}</dd>
      <dt>Learned from this run</dt><dd>${learned.length ? `<ul class="lessons">${learned.map(x => `<li>${esc(x)}</li>`).join("")}</ul>${lessonsEv.mode === "async" ? `<span class="sum">Distilled in the background after the run finished.</span>` : ""}` : queued ? "Being distilled in the background — the run didn't wait for it." : "nothing yet"}</dd></dl></section>
    <section id="d-cost"><h2>Cost</h2><dl class="kv"><dt>Total</dt><dd>${money(done?.cost_usd ?? 0)}</dd>
      <dt>By model</dt><dd>${done?.cost_by_model ? Object.entries(done.cost_by_model).map(([m, v]) => `${esc(m)}: ${money(v)}`).join("<br>") : "—"}</dd>
      <dt>Tokens</dt><dd>${done?.tokens ? `${done.tokens.prompt.toLocaleString()} prompt (${done.tokens.cached.toLocaleString()} served from cache) · ${done.tokens.completion.toLocaleString()} completion` : "—"}</dd>
      <dt>Models</dt><dd>${ev[0]?.models ? Object.entries(ev[0].models).map(([k, v]) => `${esc(k)}: ${esc(v)}`).join("<br>") : "—"}</dd></dl></section>
  </div>`;
}

async function run(id, view = "quick", focusEvent = null) {
  clearInterval(timer); lastRender = ""; stampShown = false;
  const draw = async () => {
    let r; try { r = await api("/api/runs/" + id); } catch (e) { $app.innerHTML = `<p class="empty">This run doesn't exist. <a href="#/">Back to all runs</a></p>`; clearInterval(timer); return; }
    const key = JSON.stringify([r.events.length, r.pending.map(p => p.id), r.status, r.screens.length]);
    if (key === lastRender) return; lastRender = key;
    const openState = [...document.querySelectorAll("details[data-k]")].filter(d => d.open).map(d => d.dataset.k);
    const ev = r.events, start = ev[0] || {}, done = ev.find(e => e.kind === "complete");
    const verdict = [...ev].reverse().find(e => e.kind === "verdict");
    const cost = done?.cost_usd ?? ([...ev].reverse().find(e => "cost_usd" in e) || {}).cost_usd;
    const steps = done?.steps ?? Math.max(0, ...ev.filter(e => e.step).map(e => e.step));
    const final = ["verified", "justified_stop"].includes(r.status);
    const live = ["running", "starting"].includes(r.status);
    const c = r.contract;
    const vmap = Object.fromEntries((verdict?.criteria || []).map(v => [v.id, v]));
    const claim = (ev.find(e => e.kind === "verify_start") || {}).claim;
    const summary = done?.summary || claim?.summary || "";
    const lastThought = [...ev].reverse().find(e => e.kind === "llm" && e.content);
    const verifying = ev.some(e => e.kind === "verify_start") && !verdict;
    const nToolSteps = ev.filter(e => e.kind === "tool").length;
    const elapsed = start.at ? ago(start.at, (done || ev[ev.length - 1]).at) : "";

    $app.innerHTML = `
      <section class="memo">
        <div>
          <p class="ask">${esc(start.request || "")}</p>
          ${c ? `<p class="goal">${esc(c.interpretation)}</p>` : ""}
          <p class="meta">${steps || 0} steps, ${elapsed}, ${money(cost)} in model cost</p>
          ${live ? `<p class="now">${verifying ? "Checking the result independently…" : c ? esc(firstLine(lastThought?.content) || "Working…") : "Reading the request and the company's procedures…"}</p>` : ""}
        </div>
        <div class="stamp ${live ? "live" : final ? "ok" : "bad"} ${!live && !stampShown ? "land" : ""}" role="status">${esc(STATUS[r.status] || r.status)}</div>
      </section>
      <nav class="tabs" aria-label="Run views"><a href="#/run/${esc(id)}" ${view === "quick" ? 'aria-current="page"' : ""}>Quick view</a>
        <a href="#/run/${esc(id)}/deep" ${view === "deep" ? 'aria-current="page"' : ""}>Deep dive</a></nav>
      ${view === "deep" ? deepHtml(r) : `
      <div class="cols">
        <div class="col">
          <section aria-labelledby="h-progress">
            <h2 id="h-progress">Progress</h2>
            ${c ? `<ol class="track">${c.subgoals.map(sg => { const st = sg.status || "pending"; return `
              <li class="t-${esc(st)}"><span class="dot" aria-hidden="true"></span>
                <div class="goal-line">${esc(sg.goal)}${st !== "done" ? `<span class="tag">${esc(st.replace("_", " "))}</span>` : ""}</div>
                ${sg.comment ? `<div class="why" title="${esc(sg.comment)}">${esc(sg.comment)}</div>` : ""}</li>`; }).join("")}</ol>`
              : `<p class="quiet">Working out what done means for this request…</p>`}
            <details class="more" data-k="steps"><summary>Show all ${nToolSteps} actions</summary><ol class="steps">${stepsHtml(ev)}</ol></details>
            ${Object.keys(r.notes || {}).length ? `<details class="more" data-k="notes"><summary>What the operator noted down</summary>
              <ul class="checks">${Object.entries(r.notes).map(([k, v]) => `<li><div class="row"><span></span><span><b>${esc(k.replace(/_/g, " "))}</b><br>${esc(v.value)}</span></div></li>`).join("")}</ul></details>` : ""}
          </section>
        </div>
        <div class="col">
          ${r.pending.map(p => approvalHtml(p, id)).join("")}
          <section aria-labelledby="h-checks">
            <h2 id="h-checks">Checks</h2>
            ${c ? `<ul class="checks">${c.success_criteria.map(x => { const v = vmap[x.id]; const cls = v ? (v.met ? "c-met" : "c-unmet") : "c-pending";
              const mk = v ? (v.met ? "✓" : "✗") : "○";
              return v ? `<li class="${cls}"><details data-k="c-${esc(x.id)}"><summary><span class="mk">${mk}</span><span>${esc(x.criterion)}</span></summary><p class="ev">${esc(v.evidence)}</p></details></li>`
                       : `<li class="${cls}"><div class="row"><span class="mk">${mk}</span><span>${esc(x.criterion)}</span></div></li>`; }).join("")}</ul>
              ${verdict ? "" : `<p class="quiet" style="margin-top:0.6rem">An independent checker ticks these off against the real systems when the operator finishes.</p>`}` : ""}
          </section>
          <section aria-labelledby="h-human"><h2 id="h-human">Needed a human</h2>${humanHtml(ev)}</section>
          ${r.screens.length ? `<section aria-labelledby="h-ev"><h2 id="h-ev">Evidence</h2><div class="shots">${r.screens.map(s => `<a href="/files/${esc(id)}/screens/${esc(s)}" target="_blank" rel="noopener"><img src="/files/${esc(id)}/screens/${esc(s)}" alt="Screenshot: ${esc(shotName(s))}" loading="lazy"><span>${esc(shotName(s))}</span></a>`).join("")}</div></section>` : ""}
          ${summary ? `<details class="more" data-k="summary"><summary>Operator's report</summary><div class="summary">${esc(summary)}</div></details>` : ""}
          ${r.report ? `<details class="more" data-k="report"><summary>Full audit report</summary><pre class="report">${esc(r.report)}</pre></details>` : ""}
        </div>
      </div>`}`;
    document.querySelectorAll("[data-jump]").forEach(b => b.onclick = () => document.getElementById(b.dataset.jump)?.scrollIntoView({behavior: "smooth"}));
    if (focusEvent !== null) { const el = document.getElementById("e" + focusEvent); if (el) { el.scrollIntoView({block: "center"}); el.closest(".turn")?.classList.add("flash"); el.closest("details")?.setAttribute("open", ""); } focusEvent = null; }
    openState.forEach(k => { const d = document.querySelector(`details[data-k="${k}"]`); if (d) d.open = true; });
    if (!live) stampShown = true;
    document.querySelectorAll("[data-decide]").forEach(b => b.onclick = async () => {
      const rid = b.dataset.decide;
      await api(`/api/runs/${id}/approvals/${rid}`, {method: "POST", headers: {"content-type": "application/json"},
        body: JSON.stringify({approved: b.dataset.ok === "1", text: document.getElementById("note-" + rid)?.value || ""})});
      lastRender = ""; draw();
    });
    document.querySelectorAll("[data-answer]").forEach(b => b.onclick = async () => {
      const rid = b.dataset.answer;
      await api(`/api/runs/${id}/approvals/${rid}`, {method: "POST", headers: {"content-type": "application/json"},
        body: JSON.stringify({approved: true, text: document.getElementById("ans-" + rid)?.value || ""})});
      lastRender = ""; draw();
    });
    if (!live && !r.pending.length) clearInterval(timer);
  };
  await draw(); timer = setInterval(draw, 1200);
}

function route() {
  const h = location.hash;
  let m;
  if ((m = h.match(/^#\/run\/([^/]+)\/deep(?:\/e(\d+))?$/))) return run(decodeURIComponent(m[1]), "deep", m[2] ? +m[2] : null);
  if ((m = h.match(/^#\/run\/([^/]+)$/))) return run(decodeURIComponent(m[1]));
  if (typeof knowledge === "function" && (m = h.match(/^#\/knowledge(?:\/(.+))?$/))) return knowledge(m[1] ? decodeURIComponent(m[1]) : null);
  home();
}
window.addEventListener("hashchange", route); route();
</script>
</body>
</html>
