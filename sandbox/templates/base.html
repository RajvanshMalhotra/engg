<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block title %}Kestrel Labs{% endblock %}</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; background: #f4f5f7; color: #1d2433; }
  header { background: #1f3a5f; color: #fff; padding: 10px 24px; display: flex; gap: 24px; align-items: center; }
  header a { color: #dbe7ff; text-decoration: none; }
  header strong { margin-right: 24px; }
  main { max-width: 1040px; margin: 24px auto; background: #fff; padding: 24px 32px; border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e3e6ec; font-size: 14px; }
  .unread td { font-weight: 600; }
  label { display: block; margin-top: 12px; font-size: 14px; font-weight: 600; }
  input, select, textarea { padding: 6px 8px; font-size: 14px; width: 360px; }
  textarea { width: 600px; height: 160px; }
  button { margin-top: 16px; padding: 8px 16px; background: #1f3a5f; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
  .msg { background: #e6f4ea; padding: 8px 12px; border-radius: 4px; }
  .err { background: #fde8e8; padding: 8px 12px; border-radius: 4px; color: #8a1c1c; }
  .toast { position: fixed; right: 16px; bottom: 16px; background: #333; color: #fff; padding: 10px 14px; border-radius: 6px; }
  .body { white-space: pre-wrap; border-top: 1px solid #e3e6ec; padding-top: 12px; }
  .muted { color: #6b7280; font-size: 13px; }
</style>
</head>
<body>
<header>
  {% block nav %}<strong>Kestrel Labs</strong><a href="/mail">Mail</a><a href="/erp">ERP</a>{% endblock %}
</header>
<main>
  {% if msg %}<p class="msg" role="status">{{ msg }}</p>{% endif %}
  {% if err %}<p class="err" role="alert">{{ err }}</p>{% endif %}
  {% block content %}{% endblock %}
</main>
{% if toast %}<div class="toast" role="status" aria-live="polite">{{ toast }}</div>{% endif %}
</body>
</html>
