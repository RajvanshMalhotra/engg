[project]
name = "opsagent"
version = "0.1.0"
description = "An autonomous company operator: goal -> contract -> plan -> act -> verify, with policy gates and evidence."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "openai>=3.28.0",
    "pillow>=12.3.0",
    "playwright>=1.63.0",
    "pypdf>=6.20.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "reportlab>=5.0.1",
    "rich>=15.0.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[project.scripts]
opsagent = "opsagent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["opsagent", "sandbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
